# Publică backendul pe Supabase: migrațiile bazei de date, funcția „mentor” și secretele ei.
# Se pornește manual: GitHub → Actions → „Backend deploy” → Run workflow.
name: Backend deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Migrațiile bazei de date
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Secretele funcției mentor (cheia AI rămâne doar pe server)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DAILY_FREE: ${{ vars.AI_DAILY_FREE || '15' }}
          AI_GLOBAL_DAILY: ${{ vars.AI_GLOBAL_DAILY || '3000' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-5-5' }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Lipsește secretul ANTHROPIC_API_KEY"; exit 1; }
          supabase secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" AI_PROVIDER=anthropic \
            AI_MODEL="$AI_MODEL" AI_DAILY_FREE="$AI_DAILY_FREE" AI_GLOBAL_DAILY="$AI_GLOBAL_DAILY"
      - name: Funcția mentor
        run: supabase functions deploy mentor --project-ref "$PROJECT_REF"
