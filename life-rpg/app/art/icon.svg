<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f8f"/><stop offset=".55" stop-color="#1c1450"/><stop offset="1" stop-color="#0d0f26"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d6e"/><stop offset="1" stop-color="#150f3d"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="440" r="420" fill="url(#glow)"/>
  <!-- scut -->
  <path d="M512 150 L792 250 C792 520 700 700 512 820 C324 700 232 520 232 250 Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="34" stroke-linejoin="round"/>
  <!-- săgeți de nivel -->
  <path d="M372 560 L512 420 L652 560" fill="none" stroke="url(#gold)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M392 420 L512 300 L632 420" fill="none" stroke="url(#gold)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
  <!-- bara de XP -->
  <rect x="332" y="640" width="360" height="42" rx="21" fill="#0d0f26" stroke="#fbbf24" stroke-opacity=".5" stroke-width="6"/>
  <rect x="338" y="646" width="250" height="30" rx="15" fill="url(#xp)"/>
  <!-- scântei -->
  <path d="M790 150 l14 40 40 14 -40 14 -14 40 -14 -40 -40 -14 40 -14z" fill="#fde68a"/>
  <path d="M220 700 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" fill="#c4b5fd"/>
