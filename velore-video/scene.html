<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- helpers ---------------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const smoother=t=>{t=clamp(t);return t*t*t*(t*(t*6-15)+10)};
const easeOutCubic=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const easeInOutSine=t=>{t=clamp(t);return -(Math.cos(Math.PI*t)-1)/2};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}

await document.fonts.load('300 100px "Cormorant Garamond"');
await document.fonts.load('500 100px "Cormorant Garamond"');
await document.fonts.load('italic 400 100px "Cormorant Garamond"');
await document.fonts.load('500 40px "Montserrat"');
await document.fonts.load('400 40px "Montserrat"');

/* logo letters */
const LOGO='VELORÉ';
document.querySelector('#logo1 .word').innerHTML=[...LOGO].map(ch=>`<span>${ch}</span>`).join('');
const logoSpans=[...document.querySelectorAll('#logo1 .word span')];

/* ---------------- renderer ---------------- */
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a140f');
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.30;

const camera=new THREE.PerspectiveCamera(35,W/H,0.01,50);

/* ---------------- wall ---------------- */
// wall spans x[-4,4], y[-2.5,3.5]  (512 px / m)
const WALL={x0:-4,y0:-2.5,w:8,h:6,ppm:400};
function wallPx(x,y){return[(x-WALL.x0)*WALL.ppm,(WALL.y0+WALL.h-y)*WALL.ppm]}
function makeWindowLight(){
  const cw=WALL.w*WALL.ppm,ch=WALL.h*WALL.ppm;
  const src=canvas(cw,ch),g=src.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,cw,ch);
  // sunlit window projection: 3 cols x 2 rows of panes, sheared diagonally
  const ppm=WALL.ppm;
  const [ox,oy]=wallPx(-1.75,2.55);   // top-left corner of the projection
  g.save();
  g.translate(ox,oy);
  g.transform(1,0.30,0.42,1,0,0);     // shear -> diagonal light
  const paneW=0.78*ppm,paneH=1.25*ppm,mull=0.075*ppm;
  g.fillStyle='#fff';
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){
    g.fillRect(c*(paneW+mull),r*(paneH+mull),paneW,paneH);
  }
  g.restore();
  const out=canvas(cw,ch),o=out.getContext('2d');
  o.fillStyle='#000';o.fillRect(0,0,cw,ch);
  o.filter='blur(46px)';o.globalAlpha=0.55;o.drawImage(src,0,0);
  o.filter='blur(14px)';o.globalAlpha=0.65;o.drawImage(src,0,0);
  o.filter='none';o.globalAlpha=1;
  // soft falloff towards bottom-right (penumbra grows away from window)
  const gr=o.createLinearGradient(0,0,cw*0.7,ch);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.55)');
  o.fillStyle=gr;o.globalCompositeOperation='multiply';o.fillRect(0,0,cw,ch);
  return out;
}
function makePlaster(size,seed,strength){
  const c=canvas(size,size),g=c.getContext('2d'),r=rng(seed);
  const img=g.createImageData(size,size);
  // value noise, tileable, 3 octaves
  const oct=[[8,0.5],[32,0.3],[128,0.2]];
  const grids=oct.map(([n])=>{const a=new Float32Array(n*n);for(let i=0;i<n*n;i++)a[i]=r();return a});
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    let v=0;
    oct.forEach(([n,amp],k)=>{
      const fx=x/size*n,fy=y/size*n,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy;
      const a=grids[k],q=(i,j)=>a[((j%n+n)%n)*n+((i%n+n)%n)];
      const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      v+=amp*lerp(lerp(q(ix,iy),q(ix+1,iy),sx),lerp(q(ix,iy+1),q(ix+1,iy+1),sx),sy);
    });
    const p=(y*size+x)*4,val=Math.round(255*(1-strength+strength*v));
    img.data[p]=img.data[p+1]=img.data[p+2]=val;img.data[p+3]=255;
  }
  g.putImageData(img,0,0);return c;
}
const plasterMap=tex(makePlaster(512,7,0.10));plasterMap.wrapS=plasterMap.wrapT=THREE.RepeatWrapping;plasterMap.repeat.set(8*1.2,6*1.2);
const plasterBump=tex(makePlaster(512,11,1.0),false);plasterBump.wrapS=plasterBump.wrapT=THREE.RepeatWrapping;plasterBump.repeat.set(8*4,6*4);
const windowTex=tex(makeWindowLight(),false);
const wallMat=new THREE.MeshStandardMaterial({color:'#a8937c',map:plasterMap,bumpMap:plasterBump,bumpScale:0.6,roughness:0.95,
  emissive:new THREE.Color('#ffcf9a'),emissiveMap:windowTex,emissiveIntensity:0.46,envMapIntensity:0.5});
const wall=new THREE.Mesh(new THREE.PlaneGeometry(WALL.w,WALL.h),wallMat);
wall.position.set(WALL.x0+WALL.w/2,WALL.y0+WALL.h/2,0);
wall.receiveShadow=true;scene.add(wall);

/* ---------------- lights ---------------- */
const hemi=new THREE.HemisphereLight('#f3e4d0','#4a3a2c',0.85);scene.add(hemi);
const key=new THREE.DirectionalLight('#ffe2bf',1.35);
key.position.set(-2.2,2.8,3.2);key.target.position.set(0,0,0);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-1.3,right:1.3,top:1.3,bottom:-1.3,near:0.5,far:9});
key.shadow.bias=-0.0004;key.shadow.normalBias=0.01;key.shadow.radius=6;
scene.add(key,key.target);
const fill=new THREE.DirectionalLight('#d9c6b0',0.35);fill.position.set(2.5,0.5,3);scene.add(fill);

/* ---------------- textures for objects ---------------- */
function goldGrad(g,x0,y0,x1,y1){
  const gr=g.createLinearGradient(x0,y0,x1,y1);
  gr.addColorStop(0,'#8a6a34');gr.addColorStop(0.28,'#e3c58a');gr.addColorStop(0.5,'#b48a48');
  gr.addColorStop(0.72,'#f0d9a3');gr.addColorStop(1,'#8f6c36');return gr;
}
function noteTexture(){
  const w=1248,h=528,c=canvas(w,h),g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#e6dcc4');bg.addColorStop(1,'#d8ccb0');
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  // guilloche
  g.strokeStyle='rgba(92,70,46,0.20)';g.lineWidth=1.2;
  for(let k=0;k<26;k++){g.beginPath();for(let x=0;x<=w;x+=4){const y=h/2+Math.sin(x*0.018+k*0.42)*(h*0.36)*Math.cos(x*0.004+k*0.1);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
  // frame
  g.strokeStyle='#5c442c';g.lineWidth=6;g.strokeRect(22,22,w-44,h-44);
  g.lineWidth=2;g.strokeRect(38,38,w-76,h-76);
  // medallion with V monogram
  const cx=232,cy=h/2;
  g.fillStyle='#efe6d2';g.beginPath();g.arc(cx,cy,162,0,Math.PI*2);g.fill();
  g.strokeStyle='#6b4f2a';g.lineWidth=5;g.stroke();
  g.lineWidth=1.5;for(let i=0;i<72;i++){const a=i/72*Math.PI*2;g.beginPath();g.moveTo(cx+Math.cos(a)*150,cy+Math.sin(a)*150);g.lineTo(cx+Math.cos(a)*165,cy+Math.sin(a)*165);g.stroke()}
  g.fillStyle='#3a2a1c';g.font='500 250px "Cormorant Garamond"';g.textAlign='center';g.textBaseline='middle';g.fillText('V',cx,cy+12);
  // right side: wordmark + ornament (no denominations)
  g.fillStyle='#3d2c1d';g.font='500 92px "Cormorant Garamond"';g.fillText('VELORÉ',890,h/2-40);
  g.font='500 21px "Montserrat"';g.fillText('T H R E E - D I M E N S I O N A L   A R T',890,h/2+40);
  g.strokeStyle='#6b4f2a';g.lineWidth=2;g.beginPath();g.moveTo(700,h/2+90);g.lineTo(1080,h/2+90);g.stroke();
  g.fillStyle='rgba(176,141,87,0.85)';g.beginPath();g.arc(1100,110,44,0,Math.PI*2);g.fill();
  g.fillStyle='#3a2a1c';g.font='500 52px "Cormorant Garamond"';g.fillText('V',1100,114);
  return tex(c);
}
function edgeTexture(vertical){
  const c=canvas(256,256),g=c.getContext('2d'),r=rng(5);
  g.fillStyle='#d8cdb3';g.fillRect(0,0,256,256);
  for(let i=0;i<256;i+=2){g.fillStyle=`rgba(80,62,40,${0.10+r()*0.18})`;vertical?g.fillRect(i,0,1,256):g.fillRect(0,i,256,1)}
  return tex(c);
}
function bandTexture(){
  const w=256,h=1024,c=canvas(w,h),g=c.getContext('2d');
  g.fillStyle=goldGrad(g,0,0,w,0);g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(60,40,15,0.55)';g.lineWidth=3;g.strokeRect(10,-10,w-20,h+20);
  g.save();g.translate(w/2,h/2);g.rotate(-Math.PI/2);
  g.fillStyle='#2a1d14';g.font='500 150px "Cormorant Garamond"';g.textAlign='center';g.textBaseline='middle';g.fillText('VELORÉ',0,6);
  g.restore();return tex(c);
}
function staySign(){
  const w=2048,h=360,c=canvas(w,h),g=c.getContext('2d');
  g.font='500 250px "Cormorant Garamond"';g.textAlign='center';g.textBaseline='middle';
  if('letterSpacing' in g)g.letterSpacing='22px';
  g.fillStyle=goldGrad(g,0,40,0,h-40);g.fillText('STAY HUNGRY.',w/2,h/2+10);
  return c;
}
function plaqueTexture(){
  const w=1024,h=192,c=canvas(w,h),g=c.getContext('2d');
  g.fillStyle=goldGrad(g,0,0,w,h);g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(60,40,15,0.6)';g.lineWidth=4;g.strokeRect(14,14,w-28,h-28);
  g.fillStyle='rgba(42,29,20,0.92)';g.font='500 92px "Cormorant Garamond"';g.textAlign='center';g.textBaseline='middle';
  if('letterSpacing' in g)g.letterSpacing='24px';g.fillText('VELORÉ',w/2+12,h/2+6);
  return tex(c);
}
function iconTex(kind){
  const c=canvas(128,128),g=c.getContext('2d');
  g.fillStyle='#1b1b1b';g.fillRect(0,0,128,128);
  g.strokeStyle='#b9b2a6';g.fillStyle='#b9b2a6';g.lineWidth=7;g.lineCap='round';
  if(kind<2){ // padlock closed/open
    g.strokeRect(40,62,48,36);g.beginPath();
    if(kind===0)g.arc(64,62,16,Math.PI,0);else g.arc(64,56,16,Math.PI,-0.2);
    g.stroke();
  }else{ // trunk
    g.beginPath();g.moveTo(30,80);g.lineTo(46,50);g.lineTo(82,50);g.lineTo(98,80);g.closePath();g.stroke();
  }
  return tex(c);
}

/* ---------------- FRAME A : black shadow box ---------------- */
const FA=new THREE.Group();FA.position.set(-0.33,0,0);scene.add(FA);
const fw=0.50,fh=0.66,fd=0.075,fb=0.036;   // outer w/h, depth, border
const iw=fw-2*fb,ih=fh-2*fb;
function buildFrame(group,mat,depth){
  const parts=[
    [fw,fb,depth,0,(fh-fb)/2],[fw,fb,depth,0,-(fh-fb)/2],
    [fb,fh-2*fb,depth,-(fw-fb)/2,0],[fb,fh-2*fb,depth,(fw-fb)/2,0]];
  for(const [w,h,d,x,y] of parts){
    const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,0.004),mat);
    m.position.set(x,y,d/2);m.castShadow=true;m.receiveShadow=true;group.add(m);
  }
}
const blackFrameMat=new THREE.MeshPhysicalMaterial({color:'#0e0d0c',roughness:0.42,clearcoat:0.5,clearcoatRoughness:0.25,envMapIntensity:0.9});
buildFrame(FA,blackFrameMat,fd);
// gold fillet on inner front edge
{const gm=new THREE.MeshStandardMaterial({color:'#c9a66b',metalness:1,roughness:0.28,envMapIntensity:1.2});
 const t=0.004;
 for(const [w,h,x,y] of [[iw+2*t,t,0,ih/2+t/2],[iw+2*t,t,0,-ih/2-t/2],[t,ih,-iw/2-t/2,0],[t,ih,iw/2+t/2,0]]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.004),gm);m.position.set(x,y,fd-0.002);FA.add(m);}
}
// back panel: matte black velvet
const back=new THREE.Mesh(new THREE.PlaneGeometry(iw,ih),new THREE.MeshStandardMaterial({color:'#17120f',roughness:1,envMapIntensity:0.15}));
back.position.z=0.006;back.receiveShadow=true;FA.add(back);
// LED strip (warm) along inner top, plus spotlight down
const ledMat=new THREE.MeshBasicMaterial({color:'#ffcf8f'});
const led=new THREE.Mesh(new THREE.BoxGeometry(iw-0.01,0.004,0.006),ledMat);led.position.set(0,ih/2-0.003,fd-0.012);FA.add(led);
const ledGlowC=canvas(256,256);{const g=ledGlowC.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,200,130,0.55)');gr.addColorStop(1,'rgba(255,200,130,0)');g.fillStyle=gr;g.fillRect(0,0,256,256)}
const ledGlow=new THREE.Mesh(new THREE.PlaneGeometry(iw,0.10),new THREE.MeshBasicMaterial({map:tex(ledGlowC),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
ledGlow.position.set(0,ih/2-0.05,0.0075);FA.add(ledGlow);
const spotA=new THREE.SpotLight('#ffbf7a',1.1,0,Math.PI*0.42,0.9,1.6);
spotA.position.set(0,ih/2-0.004,fd-0.014);spotA.target.position.set(0,-ih/2,0.0);
spotA.castShadow=true;spotA.shadow.mapSize.set(1024,1024);spotA.shadow.bias=-0.0006;spotA.shadow.camera.near=0.01;spotA.shadow.radius=4;
FA.add(spotA,spotA.target);

// "STAY HUNGRY." raised gold letters (stacked layers -> 3D)
{const sc=staySign();const t=tex(sc);
 const sw=0.36,sh=sw*sc.height/sc.width;
 const layers=7;
 for(let i=0;i<layers;i++){
   const top=i===layers-1;
   const m=new THREE.MeshStandardMaterial({map:t,transparent:false,alphaTest:0.45,metalness:top?0.85:0.6,roughness:top?0.32:0.5,
     color:top?'#ffffff':'#8a6a3a',envMapIntensity:top?1.4:0.7});
   const p=new THREE.Mesh(new THREE.PlaneGeometry(sw,sh),m);
   p.position.set(0,0.175,0.010+i*0.0012);p.castShadow=true;p.receiveShadow=!top;FA.add(p);
 }}
// money bundles
const noteMap=noteTexture(),edgeH=edgeTexture(false),edgeV=edgeTexture(true),bandMap=bandTexture();
function bundle(x,y,rot){
  const bw=0.158,bh=0.068,bd=0.022,g=new THREE.Group();
  const edgeMatH=new THREE.MeshStandardMaterial({map:edgeH,roughness:0.85});

function caption(node,t,a,b){ // in at a, out at b
  const pin=smoother((t-a)/0.7), pout=smoother((t-(b-0.45))/0.45);
  const op=pin*(1-pout);
  node.style.opacity=op.toFixed(3);
  const k=node.querySelector('.kick'),h=node.querySelector('.head');
  if(k){k.style.letterSpacing=(0.62-0.20*easeOutCubic((t-a)/1.4)).toFixed(3)+'em';}
  if(h){const ph=smoother((t-a-0.15)/0.75);h.style.opacity=ph.toFixed(3);h.style.transform=`translateY(${((1-ph)*26-pout*10).toFixed(2)}px)`;h.style.filter=`blur(${((1-ph)*9+pout*4).toFixed(2)}px)`;}
  node.style.display=op<=0.001?'none':'block';
}
function simpleFade(node,t,a,dur,dy=18,blur=8){
  const p=smoother((t-a)/dur);
  node.style.opacity=p.toFixed(3);node.style.transform=`translateY(${((1-p)*dy).toFixed(2)}px)`;node.style.filter=`blur(${((1-p)*blur).toFixed(2)}px)`;
  node.style.display=p<=0.001?'none':'block';
}
// black dips: [center, half-width]
const DIPS=[[4.0,0.42],[10.0,0.42],[14.5,0.42]];
function blackAt(t){
  let b=1-smooth(t/0.6);                       // fade in from black
  for(const [c,hw] of DIPS){const d=Math.abs(t-c);b=Math.max(b,1-smooth((d-0.06)/(hw-0.06)));}
  return clamp(b);
}

const tmpV=new THREE.Vector3();
function orbit(target,az,el,r,dy){ // az: + to the right, el: + up (radians)
  return new THREE.Vector3(target.x+r*Math.sin(az)*Math.cos(el),target.y+dy+r*Math.sin(el),target.z+r*Math.cos(az)*Math.cos(el));
}
function cameraAt(t){
  const D=Math.PI/180;
  if(t<4.3){ // wall + logo: slow push in
    const p=easeInOutSine(t/4.3);
    const look=new THREE.Vector3(0.05,1.30,0);
    return {pos:new THREE.Vector3(lerp(0.12,0.05,p),lerp(1.34,1.30,p),lerp(2.45,2.15,p)),look,fov:35,A:false,B:false};
  }
  if(t<10.0){ // shadow box: side close -> front pull back
    const p=smoother((t-3.7)/3.3);
    const tg=new THREE.Vector3(FA.position.x,0,0.03);
    const drift=smooth((t-6.6)/3.4);
    const az=(lerp(48,0,p)-1.5*drift)*D, el=lerp(1,0,p)*D, r=lerp(0.60,1.95,p)+0.12*drift, dy=lerp(-0.125,-0.105,p);
    const pos=orbit(tg,az,el,r,dy);
    const look=new THREE.Vector3(tg.x+lerp(0.01,0,p),tg.y+dy,tg.z);
    return {pos,look,fov:lerp(32,35,p),A:true,B:false};
  }
  if(t<14.5){ // poster: lateral parallax
    const p=easeInOutSine((t-9.7)/4.8);
    const tg=new THREE.Vector3(FB.position.x,0,0.04);
    const az=lerp(-24,12,p)*D, el=lerp(6,-2,p)*D, r=lerp(1.80,2.05,p), dy=lerp(-0.10,-0.115,p);
    return {pos:orbit(tg,az,el,r,dy),look:new THREE.Vector3(tg.x,tg.y+dy,tg.z),fov:35,A:false,B:true};
  }
  // gallery pull back
  const p=smoother((t-14.2)/4.8);
  const tg=new THREE.Vector3(0,0,0.03);
  const az=lerp(5,0,p)*D, r=lerp(2.75,3.85,p), dy=lerp(-0.02,0.0,p);
  return {pos:orbit(tg,az,0,r,dy),look:new THREE.Vector3(0,dy,0.03),fov:35,A:true,B:true};
}

function renderFrame(t){
  const cam=cameraAt(t);
  camera.fov=cam.fov;camera.updateProjectionMatrix();
  camera.position.copy(cam.pos);camera.lookAt(cam.look);
  FA.visible=cam.A;FB.visible=cam.B;
  // slow drift of window light
  windowTex.offset.set(-t*0.0016,t*0.0009);
  // subtle LED "breathing" (very slight, premium)
  spotA.intensity=1.1*(0.97+0.03*Math.sin(t*1.3));

  // --- overlays ---
  // scene 1 logo
  if(t<4.4){
    el.logo1.style.display='block';
    const out=smooth((t-3.35)/0.55);
    logoSpans.forEach((s,i)=>{
      const p=smoother((t-0.45-i*0.20)/0.95);
      s.style.opacity=(p*(1-out)).toFixed(3);
      s.style.filter=`blur(${((1-p)*22+out*6).toFixed(2)}px)`;
      s.style.transform=`translateY(${((1-p)*10).toFixed(2)}px)`;
    });
    const sc=lerp(1.0,1.045,easeInOutSine(t/4.3));
    el.logo1.style.transform=`scale(${sc.toFixed(4)})`;
    const tp=smoother((t-2.05)/0.9);
    el.tag1.style.display='block';
    el.tag1.style.opacity=(tp*(1-out)).toFixed(3);
    el.tag1.style.letterSpacing=(0.70-0.24*easeOutCubic((t-2.05)/1.4)).toFixed(3)+'em';
    el.tag1.style.transform=`scale(${sc.toFixed(4)})`;
  }else{el.logo1.style.display='none';el.tag1.style.display='none';}

  caption(el.t2a,t,6.15,8.05);
  caption(el.t2b,t,7.95,9.95);
  caption(el.t3,t,10.75,14.35);

  if(t>14.6){
    simpleFade(el.logo4,t,15.0,1.1,-14,10);
    simpleFade(el.elev,t,16.0,1.0,20,8);
    simpleFade(el.btn,t,16.6,0.9,16,6);
    simpleFade(el.foot,t,17.1,0.9,10,4);
  }else{for(const k of ['logo4','elev','btn','foot'])el[k].style.display='none';}

  el.black.style.opacity=blackAt(t).toFixed(3);
  renderer.render(scene,camera);
}

window.frameBounds=function(t){
  const cam=cameraAt(t);camera.fov=cam.fov;camera.updateProjectionMatrix();camera.position.copy(cam.pos);camera.lookAt(cam.look);camera.updateMatrixWorld();

      const px=(v.x+1)/2*W,py=(1-v.y)/2*H;x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py);}
    res[name]=[Math.round(x0),Math.round(y0),Math.round(x1),Math.round(y1)];
  }
  return res;
};
