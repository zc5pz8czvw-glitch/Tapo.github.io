/* ===== LIFE RPG — sistem de design (mobile-first, întunecat „neon”, cu temă deschisă opțională) ===== */
:root {
  color-scheme: dark;
  --bg: #060918; --bg-2: #0a1030; --bg-3: #101842;
  --ink: #eef1ff; --ink-2: #c6ccec; --muted: #94a0cc; --faint: #6a74a4;
  --card: rgba(255,255,255,.05); --card-2: rgba(255,255,255,.085); --card-solid: #0e1436;
  --line: rgba(150,162,255,.18); --line-2: rgba(150,162,255,.3);
  --purple: 168 85 247; --purple-d: 124 58 237; --blue: 56 189 248; --blue-d: 37 99 235; --green: 52 211 153; --green-d: 16 185 129;
  --gold: 251 191 36; --orange: 251 146 60; --red: 251 113 133; --red-d: 225 29 72; --pink: 244 114 182;
  --t-purple: #c9a0ff; --t-blue: #7fd3fb; --t-green: #5fe3b3; --t-gold: #fcd34d; --t-orange: #fdae6b; --t-red: #fda4af;
  --glow: .55; --shadow: 0 10px 30px -12px rgba(0,0,0,.7);
  --nav-h: 66px; --maxw: 520px; --r: 18px;
  --font: 'Poppins', 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --ease: cubic-bezier(.22,.8,.26,1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f2ff; --bg-2: #e6e8ff; --bg-3: #dcdfff;
  --ink: #12183a; --ink-2: #2c3566; --muted: #565f8c; --faint: #858db5;
  --card: #ffffff; --card-2: #f0f1ff; --card-solid: #ffffff;
  --line: rgba(60,72,170,.18); --line-2: rgba(60,72,170,.34);
  --purple: 126 34 206; --purple-d: 109 40 217; --blue: 3 105 161; --blue-d: 29 78 216; --green: 4 120 87; --green-d: 5 150 105;
  --gold: 180 83 9; --orange: 194 65 12; --red: 190 18 60; --red-d: 159 18 57; --pink: 190 24 93;
  --t-purple: #6d28d9; --t-blue: #0369a1; --t-green: #047857; --t-gold: #92400e; --t-orange: #c2410c; --t-red: #be123c;
  --glow: .22; --shadow: 0 10px 26px -14px rgba(40,50,120,.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; overscroll-behavior-y: none;
  overflow-wrap: anywhere;   /* un titlu/URL lung fără spații se rupe, în loc să lărgească pagina */
}
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
a { color: var(--t-blue); }
h1, h2, h3, h4, p { margin: 0; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid rgb(var(--gold)); outline-offset: 2px; border-radius: 10px; }
::selection { background: rgb(var(--purple) / .45); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- fundal ---------- */
.bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(800px 480px at 8% -8%, rgb(var(--purple-d) / .26), transparent 62%), radial-gradient(620px 460px at 105% 22%, rgb(var(--blue-d) / .2), transparent 60%), radial-gradient(700px 420px at 50% 112%, rgb(var(--purple) / .12), transparent 60%); }
:root[data-theme="light"] .bg-glow { background: radial-gradient(800px 480px at 8% -8%, rgb(var(--purple-d) / .1), transparent 62%), radial-gradient(620px 460px at 105% 22%, rgb(var(--blue-d) / .08), transparent 60%); }

/* ---------- structura aplicației ---------- */
#app { position: relative; z-index: 1; min-height: 100%; max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; min-height: 56px;
  background: linear-gradient(180deg, var(--bg) 55%, rgb(var(--bg-rgb, 6 9 24) / 0)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
:root[data-theme="light"] .top { background: linear-gradient(180deg, var(--bg) 60%, transparent); }
.top .ttl { flex: 1; min-width: 0; }
.top .ttl h1 { font-size: 19px; font-weight: 700; letter-spacing: .1px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .ttl small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.top.center .ttl { text-align: center; }
.top .sp { width: 40px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(135deg, rgb(var(--purple)), rgb(var(--blue-d))); box-shadow: 0 0 18px -2px rgb(var(--purple) / var(--glow)); }

  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgb(var(--navbg, 10 14 40) / .88), rgb(var(--navbg, 10 14 40) / .98));

@media (max-width: 519px) { .grid2.sx2 { grid-template-columns: minmax(0, 1fr); } }   /* cinci stele de 44 px nu încap pe o jumătate de ecran de telefon */
.ico { width: 20px; height: 20px; flex: none; } .ico.s16 { width: 16px; height: 16px; } .ico.s14 { width: 14px; height: 14px; } .ico.s24 { width: 24px; height: 24px; } .ico.s28 { width: 28px; height: 28px; } .ico.s32 { width: 32px; height: 32px; }

/* ---------- carduri ---------- */

/* ---------- butoane ---------- */
.btn { --h: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--h); padding: 0 18px; border-radius: 15px; font-weight: 700; font-size: 14.5px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgb(var(--purple)), rgb(var(--purple-d)) 55%, rgb(var(--blue-d))); box-shadow: 0 8px 22px -8px rgb(var(--purple) / .85), 0 0 0 1px rgb(255 255 255 / .12) inset;
  transition: transform .12s var(--ease), filter .2s, box-shadow .2s; text-align: center; line-height: 1.2; }

.btn.ghost.c-green { color: var(--t-green); } .btn.ghost.c-blue { color: var(--t-blue); } .btn.ghost.c-red { color: var(--t-red); } .btn.ghost.c-gold { color: var(--t-gold); } .btn.ghost.c-purple { color: var(--t-purple); }

.ibtn { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); flex: none; transition: transform .12s, background .2s; position: relative; }

.add-btn svg { transition: transform .3s var(--ease); } .add-btn:hover svg, .add-btn:active svg { transform: rotate(90deg) scale(1.15); }

/* ---------- chip-uri, taburi ---------- */

/* ---------- bare de progres, inele, stele ---------- */
.bar { height: 9px; border-radius: 99px; background: rgb(255 255 255 / .09); overflow: hidden; position: relative; }

.bar.thin { height: 6px; } .bar.thick { height: 12px; }
.bar.shimmer > i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgb(255 255 255 / .45) 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; } .stars svg { width: 15px; height: 15px; color: rgb(var(--gold)); } .stars .off { opacity: .28; }

.ring { --p: 0; position: relative; width: var(--sz, 64px); height: var(--sz, 64px); border-radius: 50%; display: grid; place-items: center; background: conic-gradient(rgb(var(--rgb, var(--green))) calc(var(--p) * 1%), rgb(255 255 255 / .1) 0); flex: none; }

.ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg-2); }
:root[data-theme="light"] .ring::before { background: #fff; }
.ring > * { position: relative; }

/* ---------- avatar + ramă ---------- */
.av { --sz: 56px; position: relative; width: var(--sz); height: var(--sz); flex: none; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--f1, #b45309), var(--f2, #f59e0b)); box-shadow: 0 0 16px -2px var(--f1, #f59e0b); }
.av > span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, var(--a1, #7c3aed), var(--a2, #38bdf8)); color: #fff; border: 2px solid rgb(0 0 0 / .35); }

.av .lv { position: absolute; right: -4px; bottom: -4px; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 99px; font-size: 11px; font-weight: 700; display: grid; place-items: center; background: #0b1030; color: var(--t-gold); border: 1.5px solid rgb(var(--gold)); }

/* ---------- câmpuri de formular ---------- */
.field { display: flex; flex-direction: column; gap: 6px; } .field + .field { margin-top: 14px; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lbl .opt, .field > label .opt { font-weight: 400; color: var(--faint); font-size: 11.5px; text-align: right; }
.inp, .txt, .sel { width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: rgb(255 255 255 / .04); color: var(--ink); font-size: 15px; transition: border-color .2s, box-shadow .2s; appearance: none; -webkit-appearance: none; }
:root[data-theme="light"] .inp, :root[data-theme="light"] .txt, :root[data-theme="light"] .sel { background: #fff; }
.txt { min-height: 96px; resize: vertical; line-height: 1.5; }
.inp:focus, .txt:focus, .sel:focus { outline: none; border-color: rgb(var(--purple)); box-shadow: 0 0 0 3px rgb(var(--purple) / .25); }
.inp::placeholder, .txt::placeholder { color: var(--faint); }
.inp.err, .txt.err, .sel.err { border-color: rgb(var(--red)); }
.err-t { color: var(--t-red); font-size: 12px; display: flex; gap: 6px; align-items: flex-start; } .err-t svg { width: 14px; height: 14px; margin-top: 2px; flex: none; }
.hint { color: var(--faint); font-size: 11.5px; line-height: 1.4; }
.sel { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.sel option { color: #111; }
.sw { position: relative; width: 54px; height: 34px; flex: none; border-radius: 99px; background: rgb(255 255 255 / .14); border: 1px solid var(--line-2); transition: background .25s; }
:root[data-theme="light"] .sw { background: #d4d8f2; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .4); transition: transform .25s var(--ease); }
.sw[aria-checked="true"] { background: linear-gradient(135deg, rgb(var(--green)), rgb(var(--green-d))); border-color: transparent; } .sw[aria-checked="true"]::after { transform: translateX(20px); }
.chk { width: 26px; height: 26px; border-radius: 9px; border: 2px solid rgb(var(--rgb, var(--green)) / .8); display: grid; place-items: center; flex: none; color: transparent; transition: all .2s var(--ease); background: transparent; }
.chk svg { width: 16px; height: 16px; stroke-width: 3; transform: scale(.4); transition: transform .25s var(--ease); }
.chk.on { background: rgb(var(--rgb, var(--green))); color: #04261b; border-color: transparent; box-shadow: 0 0 14px -2px rgb(var(--rgb, var(--green)) / .9); } .chk.on svg { transform: scale(1); }
.chk.round { border-radius: 50%; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.optc { text-align: left; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--line-2); background: rgb(255 255 255 / .03); display: flex; flex-direction: column; gap: 2px; transition: all .2s; min-height: 52px; }
:root[data-theme="light"] .optc { background: #fff; }
.optc b { font-size: 13.5px; } .optc small { font-size: 11.5px; color: var(--muted); }
.optc[aria-pressed="true"] { border-color: rgb(var(--purple)); background: rgb(var(--purple) / .18); box-shadow: 0 0 0 1px rgb(var(--purple) / .5) inset, 0 6px 18px -10px rgb(var(--purple) / .9); }
.star-in { display: flex; gap: 6px; } .star-in button { width: 44px; height: 44px; display: grid; place-items: center; color: rgb(var(--gold) / .3); transition: transform .15s; } .star-in button svg { width: 30px; height: 30px; }
.star-in button.on { color: rgb(var(--gold)); filter: drop-shadow(0 0 6px rgb(var(--gold) / .7)); } .star-in button:active { transform: scale(.85); }
.coin { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b); color: #5b3600; flex: none; }
.coin svg { width: 15px; height: 15px; }
.inp-ic { position: relative; } .inp-ic .inp { padding-right: 52px; } .inp-ic .coin, .inp-ic > svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }

/* ---------- carduri de misiuni ---------- */
.qcard { --rgb: var(--green); display: flex; gap: 12px; align-items: center; padding: 13px; border-radius: 18px; background: linear-gradient(180deg, rgb(var(--rgb) / .12), rgb(var(--rgb) / .04)); border: 1.5px solid rgb(var(--rgb) / .62); box-shadow: 0 8px 26px -16px rgb(var(--rgb) / var(--glow)); width: 100%; text-align: left; transition: transform .12s, opacity .3s; position: relative; }

:root[data-theme="light"] .qcard .qi { background: rgb(var(--rgb) / .12); }
.qcard .qi svg { width: 24px; height: 24px; }
.qcard .qt { flex: 1; min-width: 0; }
.qcard .qt b { display: block; font-size: 14.5px; line-height: 1.3; font-weight: 700; }

.qcard .qp { font-size: 11px; color: var(--muted); font-weight: 600; }

.qcard.paused { filter: saturate(.4); opacity: .8; } .qcard.failed { --rgb: var(--red); }
.qcard .tag { position: absolute; top: -9px; right: 14px; }
.cat-daily { --rgb: var(--green); } .cat-main { --rgb: var(--purple); } .cat-side { --rgb: var(--blue); } .cat-boss { --rgb: var(--red); }
.qcheck { position: relative; width: 44px; height: 44px; margin: -6px; border-radius: 50%; display: grid; place-items: center; color: transparent; flex: none; }   /* zonă de atingere 44 px; inelul vizibil are 32 px */
.qcheck::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgb(var(--rgb) / .75); background: transparent; transition: all .25s var(--ease); }
.qcheck svg { position: relative; width: 18px; height: 18px; stroke-width: 3; } .qcheck:active::before { transform: scale(.85); }
.qcheck.on { color: #04261b; }
.qcheck.on::before { background: rgb(var(--rgb)); box-shadow: 0 0 16px -2px rgb(var(--rgb)); border-color: transparent; }
.qcheck[data-a="quest-resume"], .qcheck[data-a="quest-reopen"] { color: rgb(var(--rgb)); }   /* „Reia” / „Reactivează”: pictograma trebuie să se vadă */
.mini-bar { width: 52px; }

/* ---------- pași ---------- */
.steps { display: flex; flex-direction: column; gap: 4px; }

.stepper button:active { transform: scale(.9); } .stepper output { min-width: 60px; text-align: center; font-weight: 700; font-size: 18px; }

/* ---------- Acasă ---------- */
.hero { position: relative; border-radius: 24px; overflow: hidden; min-height: 330px; border: 1px solid var(--line-2); box-shadow: 0 16px 44px -22px rgb(var(--purple) / .8); isolation: isolate; background: #1a1040; }
.hero > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero .hd { display: flex; gap: 12px; align-items: center; padding: 14px 14px 0; }

.hero .rank { position: absolute; right: 12px; top: 74px; font-size: 12px; font-weight: 700; color: #fde68a; background: rgb(10 8 30 / .55); border: 1px solid rgb(251 191 36 / .55); padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px); display: inline-flex; align-items: center; gap: 5px; }
.hero .rank svg { width: 14px; height: 14px; }

.hero .chips .chip { background: rgb(10 8 30 / .6); backdrop-filter: blur(6px); color: #fff; border-color: rgb(255 255 255 / .22); }
.mission { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 14px; border-radius: 18px; border: 1.5px solid rgb(var(--green) / .8); background: linear-gradient(135deg, rgb(var(--green) / .16), rgb(var(--green) / .04)); box-shadow: 0 0 24px -10px rgb(var(--green) / .8); width: 100%; text-align: left; position: relative; overflow: hidden; }

.mission small.k { display: block; color: var(--t-green); font-size: 12px; font-weight: 700; letter-spacing: .3px; }
.mission b { display: block; font-size: 15px; line-height: 1.3; margin: 1px 0; }
.mission .go { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--gold)); color: #3b2500; flex: none; } .mission .go svg { width: 20px; height: 20px; }
.mission .xpv { color: var(--t-gold); font-weight: 700; font-size: 13.5px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.tile { padding: 12px 8px; border-radius: 16px; text-align: center; background: var(--card); border: 1px solid var(--line); }
.tile b { display: block; font-size: 19px; line-height: 1.2; } .tile small { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }
.tile svg { margin: 0 auto 4px; width: 20px; height: 20px; }
.attr-mini { display: grid; grid-template-columns: 22px 1fr 38px; align-items: center; gap: 10px; padding: 7px 0; }
.attr-mini svg { width: 18px; height: 18px; } .attr-mini .nm { font-size: 12.5px; display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--ink-2); }
.attr-mini .lv { font-size: 12px; font-weight: 700; text-align: right; }

/* ---------- statistici (atribute) ---------- */
.attr-card { --rgb: var(--purple); text-align: center; padding: 16px 10px 14px; border-radius: 20px; border: 1.5px solid rgb(var(--rgb) / .7); background: radial-gradient(circle at 50% 0, rgb(var(--rgb) / .22), rgb(var(--rgb) / .04) 70%); box-shadow: 0 10px 30px -16px rgb(var(--rgb) / var(--glow)); width: 100%; transition: transform .12s; }

.attr-card .xg { font-size: 12.5px; font-weight: 700; color: var(--t-green); display: block; margin-top: 2px; }

/* ---------- jurnal / cronologie ---------- */
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, rgb(var(--green) / .7), rgb(var(--purple) / .5)); border-radius: 2px; }

.tl .xv.neg { color: var(--t-red); } .tl .it.rev .tx { text-decoration: line-through; opacity: .6; }
.day-h { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; margin: 16px 0 8px 2px; }
.t-quest { --rgb: var(--green); } .t-focus { --rgb: var(--blue); } .t-boss_stage, .t-boss { --rgb: var(--red); } .t-achievement { --rgb: var(--gold); } .t-skill { --rgb: var(--purple); } .t-review { --rgb: var(--orange); } .t-bonus { --rgb: var(--pink); } .t-correction { --rgb: var(--red); }

/* ---------- grafice ---------- */
.chart { width: 100%; height: auto; overflow: visible; } .chart text { font-family: var(--font); fill: var(--muted); font-size: 10px; }
.chart .bar-r { fill: url(#gBar); transition: opacity .2s; } .chart .grid-l { stroke: var(--line); stroke-width: 1; } .chart .today { fill: url(#gBarToday); }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; } .heat i { aspect-ratio: 1; border-radius: 6px; background: rgb(255 255 255 / .06); display: block; position: relative; }
:root[data-theme="light"] .heat i { background: rgb(40 50 120 / .08); }
.heat i[data-l="1"] { background: rgb(var(--green) / .35); } .heat i[data-l="2"] { background: rgb(var(--green) / .6); } .heat i[data-l="3"] { background: rgb(var(--green) / .85); box-shadow: 0 0 8px rgb(var(--green) / .6); } .heat i.today { outline: 2px solid rgb(var(--gold)); }
.heat-h { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 4px; font-size: 10.5px; color: var(--faint); text-align: center; }

/* ---------- realizări ---------- */
.badge { --rgb: var(--gold); text-align: center; padding: 14px 6px 12px; border-radius: 18px; background: radial-gradient(circle at 50% 0, rgb(var(--rgb) / .22), rgb(var(--rgb) / .04) 75%); border: 1.5px solid rgb(var(--rgb) / .7); width: 100%; box-shadow: 0 10px 26px -16px rgb(var(--rgb) / var(--glow)); position: relative; transition: transform .12s; }

.badge b { display: block; font-size: 12px; line-height: 1.25; padding: 0 2px; } .badge small { display: block; font-size: 11.5px; font-weight: 700; color: var(--t-gold); margin-top: 2px; }
.badge.locked { --rgb: 120 130 170; filter: grayscale(.85); opacity: .75; box-shadow: none; } .badge.locked .mi { box-shadow: none; } .badge.locked small { color: var(--muted); font-weight: 500; }
.badge .lk { position: absolute; top: 8px; right: 8px; color: var(--faint); } .badge .lk svg { width: 14px; height: 14px; }

.unlock-banner { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: linear-gradient(135deg, rgb(var(--gold) / .2), rgb(var(--orange) / .08)); border: 1.5px solid rgb(var(--gold) / .8); box-shadow: 0 0 26px -8px rgb(var(--gold) / .7); animation: popIn .5s var(--ease) both; }

/* ---------- arbore de abilități ---------- */
.sk-wrap { border-radius: 22px; border: 1px solid var(--line-2); background: radial-gradient(circle at 50% 18%, rgb(var(--purple-d) / .26), transparent 62%), var(--card); overflow: hidden; padding: 6px 0; position: relative; }
.sk-svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.sk-edge { fill: none; stroke: rgb(var(--blue) / .35); stroke-width: 2.2; stroke-linecap: round; } .sk-edge.on { stroke: rgb(var(--gold) / .9); filter: drop-shadow(0 0 5px rgb(var(--gold) / .8)); } .sk-edge.rdy { stroke: rgb(var(--green) / .8); }
.sk-node { cursor: pointer; } .sk-node .hex { fill: var(--card-solid); stroke-width: 2.4; transition: all .2s; }
.sk-node[data-s="done"] .hex { stroke: rgb(var(--gold)); fill: rgb(var(--gold) / .2); filter: drop-shadow(0 0 7px rgb(var(--gold) / .8)); }
.sk-node[data-s="ready"] .hex { stroke: rgb(var(--green)); fill: rgb(var(--green) / .18); animation: nodePulse 1.8s ease-in-out infinite; }
.sk-node[data-s="available"] .hex { stroke: rgb(var(--blue)); fill: rgb(var(--blue) / .12); }
.sk-node[data-s="locked"] .hex { stroke: var(--faint); stroke-dasharray: 4 3; }
.sk-node .ic { color: var(--ink-2); } .sk-node[data-s="done"] .ic { color: rgb(var(--gold)); } .sk-node[data-s="ready"] .ic { color: rgb(var(--green)); } .sk-node[data-s="available"] .ic { color: rgb(var(--blue)); } .sk-node[data-s="locked"] .ic { color: var(--faint); }
.sk-node text { font-family: var(--font); font-size: 10.5px; font-weight: 600; fill: var(--ink-2); text-anchor: middle; } .sk-node[data-s="locked"] text { fill: var(--faint); }
.sk-node:active .hex { transform: scale(.94); transform-box: fill-box; transform-origin: center; }
.sk-center .hex { fill: rgb(var(--gold) / .16); stroke: rgb(var(--gold)); stroke-width: 3; filter: drop-shadow(0 0 12px rgb(var(--gold) / .8)); }
.hubs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.req { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 13px; line-height: 1.4; } .req .chk { width: 22px; height: 22px; margin-top: 1px; } .req .chk svg { width: 13px; height: 13px; }
.req .pr { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 2px; display: block; }

/* ---------- mentor ---------- */
.mentor-hd { display: flex; align-items: center; gap: 12px; }
.bot { width: 58px; height: 58px; flex: none; filter: drop-shadow(0 0 14px rgb(var(--blue) / .8)); }

.status-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; } .status-chip i { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--green)); box-shadow: 0 0 8px rgb(var(--green)); } .status-chip.local i { background: rgb(var(--gold)); box-shadow: 0 0 8px rgb(var(--gold)); }
.chat { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }

.msg.a { align-self: flex-start; background: linear-gradient(180deg, rgb(var(--purple) / .16), rgb(var(--blue) / .08)); border: 1.5px solid rgb(var(--purple) / .5); border-bottom-left-radius: 6px; box-shadow: 0 0 22px -12px rgb(var(--purple) / .8); }
.msg.u { align-self: flex-end; background: linear-gradient(135deg, rgb(var(--purple)), rgb(var(--purple-d))); color: #fff; border-bottom-right-radius: 6px; max-width: 86%; }
.msg h4 { font-size: 13px; font-weight: 700; margin: 10px 0 4px; color: var(--t-purple); letter-spacing: .2px; } .msg h4:first-child { margin-top: 0; }

.msg ul, .msg ol { margin: 6px 0; padding-left: 20px; } .msg li { margin: 4px 0; } .msg strong { color: var(--ink); } .msg.u strong { color: #fff; } .msg code { background: rgb(0 0 0 / .3); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.msg .src { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--muted); } .msg .src svg { width: 13px; height: 13px; }
.msg .fb { margin-top: 8px; font-size: 11.5px; padding: 8px 10px; border-radius: 10px; background: rgb(var(--gold) / .12); border: 1px solid rgb(var(--gold) / .4); color: var(--ink-2); }
.rec-card { margin-top: 14px; padding: 14px; border-radius: 18px; border: 1.5px solid rgb(var(--green) / .8); background: linear-gradient(135deg, rgb(var(--green) / .14), rgb(var(--green) / .03)); box-shadow: 0 0 24px -10px rgb(var(--green) / .8); }
.rec-card h3 { color: var(--t-green); display: flex; gap: 8px; align-items: center; font-size: 14.5px; } .rec-card h3 svg { width: 20px; height: 20px; }
.rec-card p { margin-top: 6px; font-size: 13.5px; }
.compose { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); display: flex; gap: 8px; align-items: flex-end; margin-top: 14px; padding: 8px; border-radius: 20px; background: var(--card-solid); border: 1.5px solid var(--line-2); box-shadow: 0 -8px 30px -10px rgb(0 0 0 / .6); z-index: 5; }
.compose textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 12px; border: 0; background: transparent; resize: none; font-size: 15px; line-height: 1.4; outline: none; }
.compose .send { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, rgb(var(--purple)), rgb(var(--blue-d))); color: #fff; display: grid; place-items: center; flex: none; } .compose .send:disabled { opacity: .4; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 4px; margin: 10px -16px 0; scrollbar-width: none; } .chips-scroll::-webkit-scrollbar { display: none; }
.qchip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; min-height: 40px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1.5px solid rgb(var(--purple) / .5); background: rgb(var(--purple) / .08); color: var(--ink); } .qchip svg { width: 15px; height: 15px; color: var(--t-purple); } .qchip:active { transform: scale(.95); } .qchip:disabled { opacity: .5; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--t-purple); animation: bounce 1.1s infinite ease-in-out; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.lang-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .lang-pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink-2); font-size: 12px; } .lang-pick button b { font-size: 15px; color: var(--ink); } .lang-pick button[aria-pressed="true"] { border-color: rgb(var(--purple)); background: rgb(var(--purple) / .18); }
.ob.wlc > .lang-pick { margin-bottom: 8px; }
.lb { padding: 4px 0; } .lb-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); } .lb-row:last-child { border-bottom: 0; }
.lb-row.me { background: rgb(var(--purple) / .12); border-radius: 12px; } .lb-row .lt { flex: 1; min-width: 0; display: flex; flex-direction: column; } .lb-row .lt b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lb-row .lt small { font-size: 11.5px; color: var(--muted); }
.lb-rk { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.lb-rk.lb-t1 { background: linear-gradient(135deg, #fde047, #f59e0b); color: #3b2300; } .lb-rk.lb-t2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #1e293b; } .lb-rk.lb-t3 { background: linear-gradient(135deg, #f0b37e, #b45309); color: #2a1300; }
.lb-row .ibtn { width: 32px; height: 32px; min-width: 32px; min-height: 32px; border-radius: 10px; } .lb-row .ibtn svg { width: 16px; height: 16px; }
.lb-v { text-align: right; display: flex; flex-direction: column; } .lb-v b { font-size: 16px; font-variant-numeric: tabular-nums; } .lb-v small { font-size: 11px; color: var(--muted); }
.lb-me { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: rgb(var(--green) / .2); color: var(--t-green); vertical-align: middle; }
.lb-h { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0; } .code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.45; word-break: break-all; padding: 10px 12px; border-radius: 12px; background: var(--bg-2, rgb(0 0 0 / .25)); border: 1px dashed var(--line); user-select: all; -webkit-user-select: all; max-height: 92px; overflow: auto; }

.sug-jump { display: flex; align-items: center; gap: 8px; width: 100%; margin: 4px 0 10px; padding: 10px 14px; border-radius: 14px; background: rgb(var(--blue) / .12); border: 1.5px solid rgb(var(--blue) / .45); color: var(--ink); font-size: 13px; font-weight: 600; text-align: left; }

.sug-jump span { flex: 1; } .sug-jump b { display: inline-flex; align-items: center; gap: 4px; color: var(--t-blue); white-space: nowrap; } .sug-jump .ico { flex: none; }
.sug { margin-top: 10px; padding: 12px; border-radius: 16px; background: var(--card); border: 1.5px solid rgb(var(--rgb, var(--blue)) / .55); }
.sug b.t { display: block; font-size: 14px; } .sug .why { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; display: flex; gap: 6px; align-items: flex-start; } .sug .why .ico { margin-top: 1px; color: rgb(var(--gold)); }
.sug .btn-row { gap: 8px; } .sug .btn-row .btn { white-space: nowrap; padding: 0 10px; } .sug .btn-row .btn[data-a="sg-reject"] { flex: 0 0 44px; padding: 0; }

/* ---------- Boss ---------- */
.boss-hero { position: relative; border-radius: 24px; overflow: hidden; min-height: 300px; isolation: isolate; border: 1.5px solid rgb(var(--red) / .7); box-shadow: 0 16px 50px -20px rgb(var(--red) / .9); background: #1a0508; }

.toast.out { animation: toastOut .25s ease-in both; } .toast svg { width: 22px; height: 22px; flex: none; color: rgb(var(--rgb, var(--purple))); } .toast .tx { flex: 1; min-width: 0; } .toast .tx b { display: block; } .toast button.ta { pointer-events: auto; color: var(--t-blue); font-weight: 700; font-size: 13px; padding: 8px 4px; min-height: 36px; }   /* notificările nu blochează atingerile; doar butonul lor de acțiune primește atingeri */
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; font-size: 12.5px; margin: 0 0 12px; background: rgb(var(--rgb, var(--gold)) / .12); border: 1px solid rgb(var(--rgb, var(--gold)) / .5); } .banner svg { width: 18px; height: 18px; flex: none; color: rgb(var(--rgb, var(--gold))); } .banner .grow { min-width: 0; } .banner button.lnk { color: var(--t-blue); font-weight: 700; padding: 6px 2px; }
.empty { text-align: center; padding: 28px 18px; color: var(--muted); } .empty svg.big { width: 56px; height: 56px; margin: 0 auto 10px; color: var(--faint); } .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

/* ---------- onboarding ---------- */
.ob { min-height: 100dvh; display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }

.loading { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; position: relative; z-index: 1; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: rgb(var(--purple)); animation: spin .9s linear infinite; margin: 0 auto 12px; }
.save-st { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); } .save-st i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--green)); } .save-st.busy i { background: rgb(var(--gold)); animation: blink 1s infinite; } .save-st.bad i { background: rgb(var(--red)); } .save-st.bad { color: var(--t-red); }

/* ---------- efecte: XP plutitor, level-up, confetti ---------- */
.fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.fx-xp { position: absolute; font-weight: 800; font-size: 22px; color: #fde047; text-shadow: 0 0 14px rgb(251 191 36 / .9), 0 2px 4px rgb(0 0 0 / .6); animation: floatXp 1.5s cubic-bezier(.2,.7,.3,1) both; white-space: nowrap; transform: translate(-50%, -50%); }

.lvl-ov { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 22px; background: radial-gradient(circle at 50% 40%, rgb(var(--purple-d) / .55), rgb(3 4 16 / .94) 70%), rgb(3 4 16 / .78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: fadeIn .3s both; overflow-y: auto; }

.lvl-card .hexb .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 58px; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgb(251 191 36 / .9); padding-top: 12px; }

.lvl-card .rk { display: inline-flex; margin: 6px 0 4px; } .lvl-card p { color: var(--ink-2); font-size: 14px; }
.lvl-card .unl { margin: 14px 0 4px; padding: 10px 12px; border-radius: 14px; background: rgb(var(--gold) / .12); border: 1px solid rgb(var(--gold) / .5); font-size: 13px; }
.ach-pop { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 92; display: flex; justify-content: center; pointer-events: none; padding: 0 14px; }
.ach-pop .unlock-banner { pointer-events: auto; width: 100%; max-width: 440px; background: var(--card-solid); animation: dropIn .5s var(--ease) both; } .ach-pop.out .unlock-banner { animation: toastOut .3s ease-in both; }

/* ---------- animații ---------- */
@keyframes scrIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.9) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-30px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px) scale(.96); } }
@keyframes shine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-6px); opacity: 1; } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes nodePulse { 0%, 100% { filter: drop-shadow(0 0 3px rgb(52 211 153 / .6)); } 50% { filter: drop-shadow(0 0 12px rgb(52 211 153 / 1)); } }
@keyframes floatXp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -330%) scale(1); } }
@keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x, 0), var(--y, 300px)) rotate(var(--r, 540deg)); } }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgb(var(--rgb, var(--green)) / .5); } 50% { box-shadow: 0 0 0 8px rgb(var(--rgb, var(--green)) / 0); } }
.pulse { animation: pulseGlow 2s ease-out infinite; }
.pop { animation: popIn .35s var(--ease) both; }
.stagger > * { animation: scrIn .35s var(--ease) both; } .stagger > *:nth-child(2) { animation-delay: .04s; } .stagger > *:nth-child(3) { animation-delay: .08s; } .stagger > *:nth-child(4) { animation-delay: .12s; } .stagger > *:nth-child(5) { animation-delay: .16s; } .stagger > *:nth-child(n+6) { animation-delay: .2s; }

/* ---------- mișcare redusă ---------- */
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
:root[data-motion="reduced"] .conf, :root[data-motion="reduced"] .btn .shine { display: none; }
@media (prefers-reduced-motion: reduce) { :root:not([data-motion="full"]) *, :root:not([data-motion="full"]) *::before, :root:not([data-motion="full"]) *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } :root:not([data-motion="full"]) .conf, :root:not([data-motion="full"]) .btn .shine { display: none; } }

/* ---------- ecrane foarte înguste / late ---------- */
@media (max-width: 359px) { .tabs button { padding: 8px 12px; font-size: 12.5px; } .nav button { font-size: 10px; } .hero { min-height: 310px; } .grid3 { gap: 8px; } .btn { padding: 0 14px; } }
@media (min-width: 560px) { body { background-image: none; } #app { box-shadow: 0 0 0 1px var(--line), 0 0 80px -20px rgb(var(--purple) / .4); background: rgb(var(--bg-rgb, 6 9 24) / .35); } :root[data-theme="light"] #app { background: rgb(255 255 255 / .4); } }
@media print { .nav, .top, .toasts, .fx { display: none !important; } body { background: #fff; color: #000; } }

/* ===== 00-i18n.js — limba jocului: română (textul sursă), engleză, rusă =====

const U = (() => {
  const pad = (n) => String(n).padStart(2, '0');

  /* --- ceas (decalaj pentru teste; în utilizare normală = 0) --- */
  let clockOffset = 0;

  const setClockOffset = (ms) => { clockOffset = Number(ms) || 0; };
  const getClockOffset = () => clockOffset;

  const dateKey = (ts) => {
    const d = new Date(ts === undefined ? now() : ts);

  };
  const isKey = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(new Date(k + 'T12:00:00').getTime());
  const parseKey = (key) => { const p = String(key).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12, 0, 0, 0); };

  const diffDays = (a, b) => Math.round((parseKey(b).getTime() - parseKey(a).getTime()) / 86400000);
  const weekStart = (key) => { const d = parseKey(key); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dateKey(d.getTime()); };

  const endOfDayTs = (key) => startOfDayTs(addDays(key, 1)) - 1;
  const rangeKeys = (startKey, n) => Array.from({ length: n }, (_, i) => addDays(startKey, i));

  /* --- nume în română --- */
  const MONTHS = I18N.loc.months, MONTHS_S = I18N.loc.monthsS, DAYS = I18N.loc.days, DAYS_S = I18N.loc.daysS, DAYS_1 = I18N.loc.days1;

  const fmtDay = (key) => { const d = parseKey(key); return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + d.getFullYear(); };
  const fmtDayShort = (key) => { const d = parseKey(key); return d.getDate() + ' ' + MONTHS_S[d.getMonth()]; };
  const fmtDayLong = (key) => { const d = parseKey(key); return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };

  };
  const fmtRel = (ts) => {

    if (diff < 3600000) return 'acum ' + Math.max(1, Math.round(diff / 60000)) + ' min';
    const k = dateKey(ts), t = dateKey();
    if (k === t) return 'azi, ' + fmtTime(ts);

    return fmtDayShort(k) + ', ' + fmtTime(ts);
  };
  const nf = (() => { try { return new Intl.NumberFormat(I18N.loc.num); } catch (e) { return null; } })();
  const fmtNum = (n) => {
    n = Number(n) || 0;
    if (!nf) return String(Math.round(n));
    return nf.format(Math.round(n));
  };
  /* plural românesc: 1 misiune, 2 misiuni, 20 de misiuni */
  const pl = I18N.pl;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const Prog = (() => {
  const L = CFG.levels;
  /* XP necesar ca să treci de la `level` la `level + 1` */
  const need = (level) => Math.max(1, Math.round(L.base + L.perLevel * Math.max(1, level)));
  /* XP total (de-a lungul vieții) necesar ca să ATINGI nivelul `level` (nivelul 1 = 0 XP) */
  const cum = (level) => {
    const n = Math.max(0, Math.floor(level) - 1);
    return L.base * n + L.perLevel * (n * (n + 1)) / 2;
  };
  /* Nivelul corespunzător unui total de XP (formă închisă + corecție împotriva erorilor de virgulă mobilă) */
  const levelFor = (total) => {
    total = Math.max(0, Number(total) || 0);
    const a = L.perLevel / 2, b = L.base + L.perLevel / 2;
    let n = L.perLevel > 0 ? Math.floor((-b + Math.sqrt(b * b + 4 * a * total)) / (2 * a)) : Math.floor(total / L.base);
    n = Math.max(0, n);
    while (cum(n + 2) <= total) n++;

    q.boss.attempts[q.boss.attempts.length - 1].review = String(text || '').slice(0, 2000); q.updatedAt = T(); return { ok: true };
  }
  function acceptBoss(S, tplId) {
    const tpl = BOSSES.find((b) => b.id === tplId); if (!tpl) return fail('nf', 'Boss Battle-ul nu există.');
    if (S.quests.some((q) => q.category === 'boss' && !q.archived && (q.status === 'available' || q.status === 'in_progress' || q.status === 'paused'))) return fail('limit', 'Poți avea un singur Boss Battle activ odată.');
    if (S.quests.some((q) => q.templateId === tplId && q.status === 'completed')) return fail('won', 'Ai învins deja acest Boss Battle.');
    const ex = S.quests.find((q) => q.templateId === tplId && q.status === 'failed');
    if (ex) return reopenQuest(S, ex.id, U.addDays(today(), tpl.deadlineDays || 30));
    const d = Val.questDraft(draftFromTemplate(tpl, { deadline: U.addDays(today(), tpl.deadlineDays || 30), rewardReviewed: true }), { strict: false });
    if (!d.clean) return fail('invalid', 'Șablonul nu este valid.');
    const r = addQuest(S, d.clean, { source: 'template', templateId: tplId });
    if (r.ok) { r.quest.status = 'in_progress'; r.quest.startedAt = T(); }
    return r;
  }

  /* ---------- condiții de finalizare ---------- */
  function checkComplete(S, q, input) {
    input = input || {}; const problems = [];
    const done = q.steps.filter((s) => s.done).length;
    if (q.steps.length && done < q.steps.length) problems.push(q.category === 'boss' ? 'Finalizează toate etapele (' + done + '/' + q.steps.length + ') înainte de victorie.' : 'Bifează toți pașii (' + done + '/' + q.steps.length + ').');
    if (q.target && q.progress < q.target.total) problems.push('Mai ai de făcut ' + (q.target.total - q.progress) + ' ' + q.target.unit + ' (' + q.progress + '/' + q.target.total + ').');
    if (q.criteria && !input.criteria) problems.push('Confirmă că ai îndeplinit condiția de finalizare.');
    const need = q.category === 'boss' ? CFG.boss.finalNoteMin : (q.proofRequired ? CFG.rewards.noteMin : 0);
    if (need && String(input.note || '').trim().length < need) problems.push('Scrie ce ai realizat (minimum ' + need + ' caractere).');
    return { ok: problems.length === 0, problems };
  }

  /* Previzualizare (fără modificări): ce XP ar primi misiunea acum și de ce */
  function previewComplete(S, id) {
    const q = find(S, id); if (!q) return null;
    const td = today(); const isBoss = q.category === 'boss'; const range = CFG.rewards.byDifficulty[q.difficulty];
    let factor = 1; const flags = [];
    if (!isBoss) {
      const kind = KindById[q.kind] || KindById.other; const used = Stats.usageOn(S, q.kind, td, true);
      if (used >= kind.full + kind.half) { factor = 0; flags.push('limit_zero'); } else if (used >= kind.full) { factor = 0.5; flags.push('limit_half'); }
      const win = CFG.limits.duplicateWindowMin * 60000, nt = U.norm(q.title);
      if (S.completions.some((c) => !c.reversed && c.xp > 0 && c.questId !== q.id && U.norm(c.title) === nt && T() - c.at < win)) { factor = 0; flags.push('duplicate'); }
      if (q.xp > range.max) flags.push('high_reward');
    }
    const xp = Math.min(Math.round(q.xp * factor), isBoss ? CFG.rewards.maxBoss : CFG.rewards.maxSingle);
    const bonus = q.postponeCount > 0 && !q.delayedBonusUsed && q.difficulty >= 2 && xp > 0 ? Math.min(CFG.rewards.delayedBonusMax, 5 * q.postponeCount) : 0;
    return { xp, factor, flags, bonus, requested: q.xp };
  }

  /* ---------- finalizare misiune ---------- */
  function completeQuest(S, id, input) {
    input = input || {};
    rollover(S);
    const q = find(S, id); if (!q) return fail('nf', 'Misiunea nu mai există.');
    const td = today();
    if (q.archived) return fail('archived', 'Misiunea este arhivată. Restaureaz-o înainte să o finalizezi.');
    if (q.status === 'completed') return fail('done', 'Misiunea este deja finalizată. Recompensa nu poate fi cerută a doua oară.', { dup: true });
    if (q.status === 'paused') return fail('paused', 'Misiunea este în pauză. Reia-o înainte să o finalizezi.');
    if (q.status === 'failed') return fail('expired', 'Misiunea a expirat. Reactiveaz-o (cu un termen nou) înainte să o finalizezi.');
    const chk = checkComplete(S, q, input);
    if (!chk.ok) return fail('conditions', chk.problems[0], { problems: chk.problems });
    const note = String(input.note || '').trim().slice(0, 2000);
    const isBoss = q.category === 'boss';
    const range = CFG.rewards.byDifficulty[q.difficulty];
    if (q.proofRequired && note.length >= CFG.rewards.noteMin) {
      const nn = U.norm(note);
      if (S.completions.some((c) => !c.reversed && c.questId !== q.id && c.xp > 0 && U.norm(c.note) === nn)) return fail('dupnote', 'Această dovadă a fost folosită deja la altă finalizare. Descrie ce ai făcut de data aceasta.');
    }
    /* limite zilnice pe tip de activitate și detectare de duplicate */
    let factor = 1; const flags = [];
    if (!isBoss) {
      const kind = KindById[q.kind] || KindById.other; const used = Stats.usageOn(S, q.kind, td, true);
      if (used >= kind.full + kind.half) { factor = 0; flags.push('limit_zero'); } else if (used >= kind.full) { factor = 0.5; flags.push('limit_half'); }
      const win = CFG.limits.duplicateWindowMin * 60000, nt = U.norm(q.title);
      if (S.completions.some((c) => !c.reversed && c.xp > 0 && c.questId !== q.id && U.norm(c.title) === nt && T() - c.at < win)) { factor = 0; flags.push('duplicate'); }
    }
    if (!isBoss && q.xp > range.max) flags.push('high_reward');
    let xp = Math.round(q.xp * factor);
    xp = Math.min(xp, isBoss ? CFG.rewards.maxBoss : CFG.rewards.maxSingle);
    const comp = {
      id: U.uid('cp'), questId: q.id, title: q.title, category: q.category, kind: q.kind, difficulty: q.difficulty, at: T(), dateKey: td, xp: 0, xpRequested: q.xp,
      note, minutes: input.minutes == null || input.minutes === '' ? null : U.clamp(U.int(input.minutes, 0), 0, 5000), attrs: q.attrs.slice(), flags, txnId: null,
      retry: !!q.failedBefore, delayed: q.postponeCount > 0, source: q.source, reversed: false
    };
    let res = null;
    if (xp > 0) {
      const key = q.repeat === 'daily' ? 'quest:' + q.id + ':' + td : 'quest:' + q.id;
      res = award(S, { key, type: 'quest', amount: xp, reason: (isBoss ? 'Boss învins: ' : 'Misiune: ') + q.title, refId: q.id, attrs: q.attrs, flags, meta: { cat: q.category, kind: q.kind } });
      if (!res.ok) return res.dup ? fail('dup', 'Recompensa pentru această misiune a fost deja acordată.', { dup: true }) : fail(res.code, res.error);
      comp.xp = xp; comp.txnId = res.txn.id;
    }
    let bonus = 0;
    if (comp.delayed && !q.delayedBonusUsed && q.difficulty >= 2 && xp > 0) {
      const b = Math.min(CFG.rewards.delayedBonusMax, 5 * q.postponeCount);
      if (b > 0) { const r2 = award(S, { key: 'delay:' + q.id, type: 'bonus', amount: b, reason: 'Bonus: sarcină amânată și apoi finalizată · ' + U.trunc(q.title, 60), refId: q.id, attrs: ['discipline'], flags: ['delayed'] }); if (r2.ok) { bonus = b; q.delayedBonusUsed = true; } }
    }
    q.status = 'completed'; q.completedAt = T(); q.lastDoneKey = td; q.updatedAt = T(); q.startedAt = q.startedAt || T();
    if (q.target) q.progress = q.target.total;
    q.steps.forEach((s) => { if (!s.done) { s.done = true; s.doneAt = T(); } });
    if (isBoss) { q.boss = q.boss || { attempts: [] }; q.boss.attempts.push({ n: q.attempts + 1, startedAt: q.startedAt, endedAt: T(), result: 'won', review: note.slice(0, 2000), done: q.steps.length, total: q.steps.length }); q.boss.attempts = q.boss.attempts.slice(-50); }
    S.completions.push(comp);
    S.activities.push({ id: U.uid('ac'), at: T(), dateKey: td, type: 'complete', questId: q.id, kind: q.kind, minutes: comp.minutes, text: q.title });
    emit({ kind: 'complete', questId: q.id, title: q.title, xp, factor, flags });
    const ach = after(S);
    return { ok: true, comp, xp, bonus, factor, flags, txn: res && res.txn, newAchievements: ach };
  }

  /* anulare finalizare = corecție transparentă (XP-ul inițial rămâne vizibil în jurnal, plus o corecție negativă) */
  function undoCompletion(S, compId) {
    const c = S.completions.find((x) => x.id === compId); if (!c) return fail('nf', 'Finalizarea nu există.');
    if (c.reversed) return fail('already', 'Finalizarea a fost deja anulată.', { dup: true });
    if (c.txnId) { const r = reverseTxn(S, c.txnId, 'Anulare finalizare: ' + U.trunc(c.title, 80)); if (!r.ok) return r; }
    c.reversed = true;
    const q = find(S, c.questId);
    if (q) {
      if (c.category === 'boss') { q.status = 'in_progress'; if (q.boss) q.boss.attempts = q.boss.attempts.filter((a) => a.result !== 'won'); } else if (q.status === 'completed') { q.status = q.startedAt ? 'in_progress' : 'available'; }
      q.completedAt = null; q.lastDoneKey = null; q.updatedAt = T();
      if (q.delayedBonusUsed && c.delayed) {
        const rev = reversedIds(S); const bt = S.xpLog.find((t) => t.key === 'delay:' + q.id && !rev.has(t.id));
        if (bt) reverseTxn(S, bt.id, 'Anulare bonus pentru sarcina amânată: ' + U.trunc(c.title, 60));
        q.delayedBonusUsed = false;
      }
      syncPlan(S);
    }
    const revoked = revokeStale(S);
    return { ok: true, revoked };
  }

  /* ===================================================================================
     REALIZĂRI (se deblochează doar din evenimente reale) și ABILITĂȚI
     =================================================================================== */
  function after(S) {
    const got = []; let st = Stats.core(S);
    for (let guard = 0; guard < 5; guard++) {
      let any = false;
      for (const a of ACHIEVEMENTS) {
        if (S.achievements[a.id]) continue;
        const pr = a.prog(st);
        if (pr[0] >= pr[1]) {
          S.achievements[a.id] = { at: T() };
          award(S, { key: 'ach:' + a.id, type: 'achievement', amount: a.xp, reason: 'Realizare: ' + a.name, refId: a.id, attrs: [] });
          emit({ kind: 'achievement', id: a.id }); got.push(a.id); any = true;
        }
      }
      if (!any) break; st = Stats.core(S);
    }
    return got;
  }

  /* După o anulare: realizările care nu mai au acoperire reală sunt retrase, cu o corecție XP transparentă */
  function revokeStale(S) {
    const st = Stats.core(S); const out = [];
    for (const a of ACHIEVEMENTS) {
      if (!S.achievements[a.id]) continue;
      const pr = a.prog(st); if (pr[0] >= pr[1]) continue;
      const rev = reversedIds(S);
      const t = S.xpLog.find((x) => x.amount > 0 && !rev.has(x.id) && (x.key === 'ach:' + a.id || x.key.indexOf('ach:' + a.id + '#') === 0));
      if (t) reverseTxn(S, t.id, 'Realizare retrasă (condiția nu mai este îndeplinită): ' + a.name);
      delete S.achievements[a.id]; if (S.seen && S.seen.achievements) delete S.seen.achievements[a.id];
      out.push(a.id);
    }
    return out;
  }

  const depthMemo = {};
  const SKILL_BY_ID = Object.fromEntries(SKILLS.map((s) => [s.id, s]));
  const tierOf = (id) => {
    if (depthMemo[id]) return depthMemo[id];
    const n = SKILL_BY_ID[id]; depthMemo[id] = 1; // protecție împotriva ciclurilor
    depthMemo[id] = 1 + Math.max(0, ...n.req.map(tierOf));
    return depthMemo[id];
  };
  function skillState(S, node, st) {
    st = st || Stats.core(S); const tier = tierOf(node.id);
    if (S.skills[node.id]) return { status: 'done', crits: [], missing: [], tier };
    const missing = node.req.filter((r) => !S.skills[r]);
    const crits = node.crit.map((c) => Stats.crit(S, st, c));
    if (missing.length) return { status: 'locked', missing, crits, tier };
    return { status: crits.every((c) => c.met) ? 'ready' : 'available', missing: [], crits, tier };
  }
  function unlockSkill(S, id) {
    const node = SKILL_BY_ID[id]; if (!node) return fail('nf', 'Abilitatea nu există.');
    if (S.skills[id]) return fail('done', 'Abilitatea este deja deblocată.', { dup: true });
    const stt = skillState(S, node);
    if (stt.status !== 'ready') return fail('not_ready', stt.status === 'locked' ? 'Mai întâi deblochează abilitățile anterioare.' : 'Încă nu îndeplinești toate cerințele.');
    S.skills[id] = { at: T() };
    const r = award(S, { key: 'skill:' + id, type: 'skill', amount: CFG.rewards.skillXp(stt.tier), reason: 'Abilitate deblocată: ' + node.name, refId: id, attrs: [node.branch] });
    emit({ kind: 'skill', id });
    const ach = after(S);
    return { ok: true, xp: r.ok ? r.amount : 0, newAchievements: ach };
  }

  /* ===================================================================================
     FOCUS: timp calculat din marcaje de timp, nu dintr-un contor care rulează
     =================================================================================== */
  const F = CFG.focus;
  const focusElapsed = (a, now) => (a ? Math.max(0, a.accMs + (a.status === 'running' && a.resumedAt ? (now == null ? T() : now) - a.resumedAt : 0)) : 0);
  function focusStart(S, o) {
    o = o || {};
    if (S.focus.active) return fail('busy', 'Ai deja o sesiune Focus în desfășurare.');
    const q = o.questId ? find(S, o.questId) : null;
    if (o.questId && !q) return fail('nf', 'Misiunea aleasă nu mai există.');
    const targetMs = U.clamp(Math.round(Number(o.minutes) || 25), 1, F.maxSessionHours * 60) * 60000;
    const kind = KindById[o.kind] ? o.kind : (q ? q.kind : null);
    S.focus.active = { id: U.uid('fs'), questId: q ? q.id : null, kind, title: q ? q.title : (U.trunc(o.title, 80) || (kind ? KindById[kind].name : 'Sesiune liberă')), startedAt: T(), targetMs, accMs: 0, resumedAt: T(), status: 'running' };
    if (q && q.status === 'available' && !q.archived) { q.status = 'in_progress'; q.startedAt = q.startedAt || T(); q.updatedAt = T(); }
    return { ok: true, active: S.focus.active };
  }
  function focusPause(S) {
    const a = S.focus.active; if (!a || a.status !== 'running') return fail('state', 'Sesiunea nu rulează.');
    a.accMs = Math.min(24 * 3600000, focusElapsed(a)); a.resumedAt = null; a.status = 'paused'; return { ok: true };
  }
  function focusResume(S) {
    const a = S.focus.active; if (!a || a.status !== 'paused') return fail('state', 'Sesiunea nu este în pauză.');
    a.resumedAt = T(); a.status = 'running'; return { ok: true };
  }
  function focusStop(S) {
    const a = S.focus.active; if (!a || a.status === 'finishing') return fail('state', 'Nu există o sesiune de oprit.');
    a.accMs = Math.min(24 * 3600000, focusElapsed(a)); a.resumedAt = null; a.status = 'finishing'; return { ok: true, elapsedMs: a.accMs };
  }
  function focusDiscard(S) {
    if (!S.focus.active) return fail('state', 'Nu există o sesiune de renunțat.');
    S.focus.active = null; return { ok: true };
  }
  /* încheiere cu reflecție: XP doar dacă ai notat ce ai realizat, sesiunea are cel puțin 10 minute și nu ai depășit limita zilnică */
  function focusFinish(S, o) {
    o = o || {}; const a = S.focus.active;
    if (!a) return fail('state', 'Nu există o sesiune de încheiat.');
    if (a.status !== 'finishing') return fail('state', 'Oprește mai întâi sesiunea.');
    const outcome = ['done', 'partial', 'none'].includes(o.outcome) ? o.outcome : null;
    if (!outcome) return fail('outcome', 'Alege rezultatul sesiunii.');
    const reflection = String(o.reflection || '').trim().slice(0, 2000);
    if (outcome !== 'none' && reflection.length < F.minReflectionChars) return fail('reflection', 'Scrie pe scurt ce ai realizat (minimum ' + F.minReflectionChars + ' caractere).');
    const maxMin = Math.min(F.maxSessionHours * 60, Math.round(a.accMs / 60000));
    let minutes = o.minutes == null || o.minutes === '' ? maxMin : U.clamp(U.int(o.minutes, maxMin), 0, maxMin);
    const td = today(); const rewardedToday = S.focus.history.filter((f) => f.dateKey === td && f.xp > 0).length;
    let xp = 0; const notes = [];
    if (outcome === 'none') notes.push('Fără rezultat concret: sesiunea este înregistrată, dar nu dă XP.');
    else if (minutes < F.minMinutesForXp) notes.push('Sub ' + F.minMinutesForXp + ' minute: sesiunea este înregistrată, dar nu dă XP.');
    else if (rewardedToday >= F.rewardedPerDay) notes.push('Ai atins limita de ' + F.rewardedPerDay + ' sesiuni recompensate pe zi. Sesiunea este înregistrată fără XP.');
    else xp = Math.min(F.maxXpPerSession, Math.round(minutes * F.xpPerMinute));

    if (xp > 0) {
      const attrs = a.kind ? KindById[a.kind].attrs : ['discipline'];
      const r = award(S, { key: 'focus:' + a.id, type: 'focus', amount: xp, reason: 'Sesiune Focus · ' + minutes + ' min · ' + U.trunc(a.title, 50), refId: a.questId || a.id, attrs, flags: [], meta: { min: minutes } });
      if (r.ok) { entry.xp = xp; entry.txnId = r.txn.id; } else if (!r.dup) return fail(r.code, r.error);
    }
    S.focus.history.push(entry); S.focus.history = S.focus.history.slice(-1000);
    S.activities.push({ id: U.uid('ac'), at: T(), dateKey: td, type: 'focus', questId: a.questId, kind: a.kind, minutes, text: a.title });
    S.focus.active = null;
    const ach = after(S);
    return { ok: true, entry, xp: entry.xp, notes, newAchievements: ach, questId: a.questId };
  }

  /* ===================================================================================
     REVIZUIRI
     =================================================================================== */
  const REVIEW_FIELDS = ['completed', 'learned', 'postponed', 'wentWell', 'improve'];
  function saveReview(S, key, f) {
    f = f || {};
    if (!U.isKey(key) || key > today()) return fail('date', 'Data revizuirii nu este validă.');
    const clean = {}; let filled = 0, any = 0;
    for (const k of REVIEW_FIELDS) { clean[k] = String(f[k] || '').trim().slice(0, 3000); if (clean[k]) any++; if (clean[k].length >= CFG.review.minChars) filled++; }
    if (!any) return fail('empty', 'Completează cel puțin un câmp.');
    const prev = S.reviews.daily[key];
    const r = Object.assign({}, clean, { savedAt: T(), xpAwarded: prev ? prev.xpAwarded : false, ai: prev ? prev.ai : null });
    S.reviews.daily[key] = r;
    let xp = 0;
    if (!r.xpAwarded && filled >= 3 && (key === today() || key === U.addDays(today(), -1))) {
      const a = award(S, { key: 'review:' + key, type: 'review', amount: CFG.review.xp, reason: 'Revizuire zilnică · ' + U.fmtDayShort(key), refId: key, attrs: ['discipline', 'intelligence'] });
      if (a.ok) { r.xpAwarded = true; xp = a.amount; } else if (a.dup) r.xpAwarded = true;
    }
    const ach = after(S);
    return { ok: true, xp, filled, newAchievements: ach };
  }
  function setReviewAI(S, key, text, source) {
    const r = S.reviews.daily[key]; if (!r) return fail('nf', 'Salvează mai întâi revizuirea.');
    r.ai = { text: String(text || '').slice(0, 8000), at: T(), source: source === 'ai' ? 'ai' : 'local' }; return { ok: true };
  }
  function setWeeklyAI(S, startKey, text, source) {
    if (!U.isKey(startKey)) return fail('date', 'Dată invalidă.');
    S.reviews.weekly[startKey] = { ai: { text: String(text || '').slice(0, 8000), at: T(), source: source === 'ai' ? 'ai' : 'local' } }; return { ok: true };
  }

  /* ===================================================================================
     PROFIL, MENTOR (sugestii), ONBOARDING
     =================================================================================== */
  const sanitizeList = (arr, n, len) => (Array.isArray(arr) ? arr : []).map((x) => String(x || '').trim().slice(0, len)).filter(Boolean).slice(0, n);
  function applyProfile(S, p) {
    p = p || {}; const P = S.profile;
    if (p.name !== undefined) P.name = String(p.name || '').trim().slice(0, 40);
    if (p.avatar !== undefined && AvatarById[p.avatar]) P.avatar = p.avatar;
    if (p.goals !== undefined) P.goals = sanitizeList(p.goals, 12, 140);
    if (p.projects !== undefined) P.projects = sanitizeList(p.projects, 8, 140);
    if (p.priorities !== undefined) P.priorities = U.unique((p.priorities || []).filter((a) => AttrById[a])).slice(0, 6);
    if (p.dailyMinutes !== undefined && [15, 30, 60, 120].includes(Number(p.dailyMinutes))) P.dailyMinutes = Number(p.dailyMinutes);
    if (p.experience !== undefined && ['beginner', 'intermediate', 'advanced'].includes(p.experience)) P.experience = p.experience;
    if (p.difficulty !== undefined && ['easy', 'balanced', 'challenging', 'adaptive'].includes(p.difficulty)) P.difficulty = p.difficulty;
    if (p.feedback !== undefined && ['direct', 'gentle', 'analytical'].includes(p.feedback)) P.feedback = p.feedback;
    return { ok: true };
  }
  function finishOnboarding(S, p, starterIds) {
    applyProfile(S, p); S.profile.onboarded = true;
    const added = [];
    for (const id of starterIds || []) {
      const tpl = TEMPLATES.find((t) => t.id === id); if (!tpl) continue;
      const d = Val.questDraft(draftFromTemplate(tpl), { strict: false }); if (!d.clean) continue;
      const r = addQuest(S, d.clean, { source: 'template', templateId: tpl.id }); if (r.ok) added.push(r.quest.id);
    }
    syncPlan(S);
    return { ok: true, added };
  }
  function addSuggestionDrafts(S, drafts, origin) {
    const out = [];
    for (const d of drafts) {

  L.today = (S) => {

/* ---------- componente ---------- */
const doneNow = (q) => q.status === 'completed' && (q.repeat !== 'daily' || Eng.isDoneToday(q));
function qcard(q) {
  const kind = KindById[q.kind] || KindById.other, dn = doneNow(q), sd = q.steps.filter((s) => s.done).length;
  let sub = q.desc ? U.trunc(q.desc, 64) : '';
  if (!sub && q.steps.length) sub = U.pl(q.steps.length, 'pas', 'pași');
  const dl = q.deadline && q.repeat !== 'daily' && !dn ? (q.deadline < U.dateKey() ? 'termen depășit' : 'termen ' + relDeadline(q.deadline)) : '';
  const prog = q.target ? q.progress + '/' + q.target.total : (q.steps.length ? sd + '/' + q.steps.length : '');
  let right;
  if (q.status === 'failed') right = h`<span class="chip c-red">Expirată</span><button class="qcheck" data-a="quest-reopen" data-id="${q.id}" aria-label="Reactivează misiunea">${ic('refresh')}</button>`;
  else if (q.status === 'paused') right = h`<span class="chip plain">Pauză</span><button class="qcheck" data-a="quest-resume" data-id="${q.id}" aria-label="Reia misiunea">${ic('play')}</button>`;
  else right = h`<button class="qcheck ${dn ? 'on' : ''}" data-a="quest-quick" data-id="${q.id}" aria-label="${dn ? 'Finalizată. Atinge pentru a anula' : 'Finalizează misiunea'}">${ic('check')}</button>${prog ? h`<span class="qp">${prog}</span>` : ''}`;
  return h`<div class="qcard cat-${q.category} ${dn ? 'done' : ''} ${q.status === 'paused' ? 'paused' : ''} ${q.status === 'failed' ? 'failed' : ''}">
    <button class="qmain" data-a="quest-open" data-id="${q.id}" aria-label="Deschide: ${q.title}"><span class="qi">${ic(q.category === 'boss' ? 'dragon' : kind.icon)}</span>
      <span class="qt"><b>${q.title}</b>${sub || dl ? h`<small>${sub}${sub && dl ? ' · ' : ''}${dl ? h`<span class="${q.deadline < U.dateKey() ? 't-red' : ''}">${dl}</span>` : ''}</small>` : ''}<span class="qx">${xpTxt(q.xp)}${q.repeat === 'daily' ? h` <span class="xs muted" style="font-weight:500">· zilnic</span>` : ''}</span></span></button>
    <div class="qr">${right}</div></div>`;
}
function bossCard(q) {
  const sd = q.steps.filter((s) => s.done).length;
  return h`<button class="boss-card" data-a="quest-open" data-id="${q.id}"><span class="bi">${ic('dragon')}</span><span class="grow"><b style="display:block">${q.title}</b><span class="xs muted">${q.status === 'failed' ? 'Expirat: poți reîncerca' : sd + '/' + q.steps.length + ' etape' + (q.deadline ? ' · termen ' + relDeadline(q.deadline) : '')}</span>${barH('boss.' + q.id, q.steps.length ? (sd / q.steps.length) * 100 : 0, 'thin', ['251 113 133', '251 146 60'])}</span>${ic('next', 'faint')}</button>`;
}

   =================================================================================== */
UI.qTab = 'daily'; UI.qFilter = 'active';
function listFor(cat, flt) {
  const all = S.quests.filter((q) => q.category === cat);
  if (flt === 'done') return all.filter((q) => !q.archived && q.status === 'completed' && !(q.repeat === 'daily')).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  if (flt === 'old') return all.filter((q) => q.archived || q.status === 'failed').sort((a, b) => b.updatedAt - a.updatedAt);
  const act = all.filter((q) => !q.archived && (q.status === 'available' || q.status === 'in_progress' || q.status === 'paused' || (q.repeat === 'daily' && q.status === 'completed')));
  return act.sort((a, b) => (doneNow(a) ? 1 : 0) - (doneNow(b) ? 1 : 0) || (a.status === 'paused' ? 1 : 0) - (b.status === 'paused' ? 1 : 0) || missionRank(a) - missionRank(b) || a.createdAt - b.createdAt);
}
Screens.quests = function () {
  const tab = UI.qTab, flt = UI.qFilter, td = U.dateKey();
  const cnt = (c) => S.quests.filter((q) => q.category === c && !q.archived && (q.status === 'available' || q.status === 'in_progress' || q.status === 'paused')).length;
  const head = h`<header class="top"><div class="ttl"><h1>Misiuni</h1><small>Ce faci azi contează mai mult decât ce planifici.</small></div><div class="tr"><button class="ibtn add-btn" data-a="quest-new" aria-label="Adaugă misiune">${ic('plus')}</button></div></header>`;
  const tabs = h`<div class="tabs" role="tablist" aria-label="Categorii de misiuni">${['daily', 'main', 'side', 'boss'].map((c) => { const k = CFG.categories[c]; return h`<button role="tab" aria-selected="${tab === c}" style="--rgb:${rgbOf(k.color)}" data-a="q-tab" data-v="${c}">${k.name}${c !== 'boss' && cnt(c) ? h`<span class="cnt">${cnt(c)}</span>` : ''}</button>`; })}</div>`;
  let content;
  if (tab === 'boss') content = bossTab();
  else {
    const list = listFor(tab, flt), plan = Eng.todayQuests(S).filter((q) => q.category === 'daily');
    const dailyDone = plan.filter((q) => Eng.isDoneToday(q)).length;
    content = h`
      ${tab === 'daily' && plan.length ? h`<div class="card flat row mb12"><div class="grow"><div class="row between sm"><span class="b">Azi</span><span class="muted">${dailyDone} din ${plan.length} finalizate</span></div><div class="mt8">${barH('q.daily', plan.length ? (dailyDone / plan.length) * 100 : 0, 'green thin', ['52 211 153', '16 185 129'])}</div></div></div>` : ''}
      <div class="seg mb12" role="group" aria-label="Filtru">${[['active', 'Active'], ['done', 'Finalizate'], ['old', 'Arhivă']].map((x) => h`<button aria-pressed="${flt === x[0]}" data-a="q-filter" data-v="${x[0]}">${x[1]}</button>`)}</div>
      <div class="col stagger">${list.length ? list.map(qcard) : emptyBox(flt === 'active' ? 'flag' : flt === 'done' ? 'trophy' : 'archive', flt === 'active' ? 'Nicio misiune activă' : flt === 'done' ? 'Încă nu ai finalizat nimic aici' : 'Nimic expirat sau arhivat', flt === 'active' ? 'Creează o misiune sau alege una din șabloane. Începe mic: 15–20 de minute.' : flt === 'done' ? 'Misiunile finalizate apar aici, cu XP-ul câștigat.' : 'Misiunile expirate pot fi reactivate cu un termen nou.')}</div>
      ${flt === 'active' ? h`<div class="btn-row mt16"><button class="btn add-btn" data-a="quest-new">${ic('plus')}Adaugă Misiune</button><button class="btn quiet" data-a="tpl-open" data-mode="new">${ic('layers')}Din șabloane</button></div>` : ''}`;
  }
  return { head, body: h`${tabs}${content}`, tab: 'quests' };
};

function openComplete(id) {

  UI.forms.cp = { id, criteria: false, note: '', minutes: '' };
