}
function cpState() {
  const f = UI.forms.cp, q = f && Eng.find(S, f.id); if (!q) return null;
  const chk = Eng.checkComplete(S, q, { criteria: f.criteria, note: f.note });
  return { f, q, chk, pv: Eng.previewComplete(S, q.id) };
}
function completeHtml() {
  const c = cpState(); if (!c) return h`${sheetHead('Misiunea nu mai există')}<p class="muted">Misiunea a fost ștearsă.</p>`;
  const { f, q, chk, pv } = c, kind = KindById[q.kind] || KindById.other;
  const need = q.category === 'boss' ? CFG.boss.finalNoteMin : (q.proofRequired ? CFG.rewards.noteMin : 0);
  const lines = [];
  if (pv.flags.includes('duplicate')) lines.push('O misiune cu același titlu a fost finalizată acum mai puțin de ' + CFG.limits.duplicateWindowMin + ' de minute: se înregistrează fără XP.');
  else if (pv.flags.includes('limit_zero')) lines.push('Ai atins limita zilnică pentru „' + kind.name + '”: se înregistrează fără XP. Limitele împiedică umflarea artificială a progresului.');
  else if (pv.flags.includes('limit_half')) lines.push('Ai depășit numărul de activități „' + kind.name + '” recompensate integral azi: primești 50%.');
  if (pv.flags.includes('high_reward')) lines.push('Recompensa e peste intervalul obișnuit pentru dificultatea aleasă: va fi marcată în jurnal.');
  if (pv.bonus) lines.push('Bonus pentru sarcina amânată și apoi finalizată: +' + pv.bonus + ' XP.');
  const stepsHtml = q.steps.length ? h`<h3 class="mt16 mb8" style="font-size:14px">Pași (${q.steps.filter((s) => s.done).length}/${q.steps.length})</h3><div class="steps">${q.steps.map((s) => h`<button class="step ${s.done ? 'done' : ''}" data-a="step-toggle" data-id="${q.id}" data-sid="${s.id}" ${q.category === 'boss' ? 'disabled' : ''}><span class="chk round ${s.done ? 'on' : ''}">${ic('check')}</span><span class="st-t">${s.text}</span>${s.tag && !s.done ? h`<span class="chip c-gold tg">${ic('pen')}dovadă</span>` : ''}</button>`)}</div>` : '';
  return h`${sheetHead(q.title, q.category === 'boss' ? 'Victoria cere toate etapele și o notă finală.' : 'Confirmă ce ai făcut cu adevărat.')}
    <div class="card soft c-gold row"><span class="coin">${ic('zap')}</span><div class="grow"><div class="b" style="font-size:20px">${pv.xp > 0 ? xpTxt(pv.xp + pv.bonus) : '0 XP'}</div><div class="xs muted">${pv.xp > 0 ? 'Recompensa se acordă o singură dată și rămâne în jurnal.' : 'Finalizarea se salvează, dar nu aduce XP.'}</div></div></div>
    ${lines.map((x) => h`<div class="note warn mt8">${ic('info')}<div class="grow">${x}</div></div>`)}
    ${q.target ? h`<h3 class="mt16 mb8" style="font-size:14px">Progres: ${q.progress}/${q.target.total} ${q.target.unit}</h3><div class="stepper"><button data-a="prog-step" data-id="${q.id}" data-d="-1" aria-label="Scade">−</button><output>${q.progress}</output><button data-a="prog-step" data-id="${q.id}" data-d="1" aria-label="Crește">+</button><button class="btn xs ghost c-green" data-a="prog-full" data-id="${q.id}" style="margin-left:auto">Am terminat tot</button></div>` : ''}
    ${stepsHtml}
    ${q.criteria ? h`<button class="step mt12" style="border:1.5px solid var(--line-2);padding:12px" data-a="cp-crit"><span class="chk ${f.criteria ? 'on' : ''}">${ic('check')}</span><span class="st-t"><span class="xs muted" style="display:block">Condiția de finalizare</span>${q.criteria}</span></button>` : ''}
    <div class="field mt16"><label for="cp-note">Ce ai realizat?${need ? h`<span class="opt">obligatoriu, minimum ${need} caractere</span>` : h`<span class="opt">opțional</span>`}</label>
      <textarea class="txt" id="cp-note" data-f="cp.note" data-h="cpSync" maxlength="2000" placeholder="${q.category === 'boss' ? 'Descrie rezultatul real: ce ai lansat/vândut/învățat și dovada.' : 'Ex.: ce ai făcut concret, ce ai aflat, unde poate fi văzut rezultatul.'}">${f.note}</textarea></div>
    <div class="field"><label for="cp-min">Cât a durat? <span class="opt">minute, opțional</span></label><input class="inp" id="cp-min" type="number" inputmode="numeric" min="0" max="5000" data-f="cp.minutes" placeholder="${q.minutes || 'ex. 25'}" value="${f.minutes}"></div>
    <div id="cp-problems">${cpProblems(chk)}</div>
    <button class="btn green block mt16" id="cp-go" data-a="cp-go" ${chk.ok ? '' : 'disabled'}>${ic('check')}${q.category === 'boss' ? 'Declar victoria' : 'Finalizează'}</button>`;
}
const cpProblems = (chk) => (chk.ok ? '' : h`<div class="note warn mt12">${ic('info')}<div class="grow"><b>Mai ai de făcut:</b><ul style="margin:4px 0 0;padding-left:18px">${chk.problems.map((p) => h`<li>${p}</li>`)}</ul></div></div>`);
Hk.cpSync = () => { const c = cpState(); if (!c) return; const p = $('#cp-problems'), b = $('#cp-go'); if (p) p.innerHTML = cpProblems(c.chk).toString(); if (b) b.disabled = !c.chk.ok; };
A['cp-crit'] = () => { UI.forms.cp.criteria = !UI.forms.cp.criteria; Ov.refresh('cp'); };
A['prog-step'] = (el) => { const q = Eng.find(S, el.dataset.id); if (!q) return; const r = Eng.setProgress(S, q.id, q.progress + Number(el.dataset.d)); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); };
A['prog-full'] = (el) => { const q = Eng.find(S, el.dataset.id); if (!q || !q.target) return; const r = Eng.setProgress(S, q.id, q.target.total); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); };
A['cp-go'] = () => {
  const f = UI.forms.cp; if (!f) return;
  const q = Eng.find(S, f.id), boss = q && q.category === 'boss';
  const r = Eng.completeQuest(S, f.id, { criteria: f.criteria, note: f.note, minutes: f.minutes });
  if (!r.ok) { toast(r.error, { kind: 'bad' }); Snd.err(); Ov.refresh('cp'); commit(); return; }
  Ov.close('cp'); commit();
  const msg = r.xp > 0 ? (boss ? 'Boss învins! ' : 'Misiune finalizată · ') + xpTxt(r.xp) + (r.bonus ? ' (bonus +' + r.bonus + ')' : '') : 'Finalizată, dar fără XP: ' + (r.flags.includes('duplicate') ? 'duplicat recent' : 'limita zilnică pentru acest tip a fost atinsă') + '.';
  toast(msg, { kind: r.xp > 0 ? 'good' : 'warn', icon: boss ? 'dragon' : 'checkCircle', action: { label: 'Anulează', fn: () => undoCompletion(r.comp.id, true) } });
  if (boss) go('boss', { id: q.id }, { replace: true });
};
function undoCompletion(cid, silent) {
  const r = Eng.undoCompletion(S, cid);
  if (!r.ok) { toast(r.error, { kind: 'bad' }); return; }
  commit(); toast('Finalizare anulată. XP-ul a fost corectat în jurnal.' + (r.revoked && r.revoked.length ? ' Realizări retrase: ' + r.revoked.length + '.' : ''), { kind: 'info', icon: 'undo' });
}
/* bifa din listă: dacă nu există nicio condiție, finalizăm direct; altfel deschidem foaia */
A['quest-quick'] = (el) => {
  const q = Eng.find(S, el.dataset.id); if (!q) return;
  if (q.category === 'boss') return go('boss', { id: q.id });
  if (doneNow(q)) {
    const c = S.completions.filter((x) => x.questId === q.id && !x.reversed).slice(-1)[0];
    if (!c) return;
    return confirmBox({ title: 'Anulezi finalizarea?', text: 'XP-ul primit (' + c.xp + ') va fi scăzut printr-o corecție vizibilă în jurnal.', ok: 'Anulează finalizarea', cancel: 'Păstrează', danger: true }).then((ok) => { if (ok) undoCompletion(c.id); });
  }
  if (q.status === 'paused') return toast('Misiunea este în pauză. Apasă ▶ ca s-o reiei.', { kind: 'warn' });
  const simple = !q.criteria && !q.steps.length && !q.target && !q.proofRequired;
  if (simple) { UI.forms.cp = { id: q.id, criteria: true, note: '', minutes: '' }; return A['cp-go'](); }
  openComplete(q.id);
};
A['quest-complete'] = (el) => openComplete(el.dataset.id);

/* ===================================================================================
   DETALII MISIUNE
   =================================================================================== */
A['quest-open'] = (el) => { const q = Eng.find(S, el.dataset.id); if (!q) return; go(q.category === 'boss' ? 'boss' : 'quest', { id: q.id }); };
Screens.quest = function (p) {
  const q = Eng.find(S, p.id);
  if (!q) return { head: topBar({ title: 'Detalii Misiune', back: true }), body: emptyBox('search', 'Misiunea nu mai există', 'Poate a fost ștearsă.', h`<button class="btn sm mt12" data-a="back">Înapoi</button>`), tab: 'quests' };
  if (q.category === 'boss') return Screens.boss({ id: q.id });
  const td = U.dateKey(), cat = CFG.categories[q.category], kind = KindById[q.kind] || KindById.other, range = CFG.rewards.byDifficulty[q.difficulty];
  const dn = doneNow(q), inPlan = !!(S.plans[td] && S.plans[td].ids.includes(q.id));
  const sd = q.steps.filter((s) => s.done).length, active = Eng.isActive(q);
  const hist = S.completions.filter((c) => c.questId === q.id).slice(-6).reverse();
  const head = topBar({ title: 'Detalii Misiune', back: true, right: h`<button class="ibtn ${inPlan ? '' : 'plain'}" data-a="plan-toggle" data-id="${q.id}" aria-label="${inPlan ? 'Scoate din planul de azi' : 'Adaugă în planul de azi'}" aria-pressed="${inPlan}" style="${inPlan ? 'color:var(--t-gold);border-color:rgb(var(--gold)/.7)' : ''}">${ic('star')}</button>` });
  let primary;
  if (dn) primary = h`<div class="note good">${ic('checkCircle')}<div class="grow"><b>Finalizată</b> ${q.completedAt ? U.fmtDateTime(q.completedAt) : ''}${q.repeat === 'daily' ? ' · se resetează mâine' : ''}</div></div>`;
  else if (q.status === 'completed') primary = h`<div class="note good">${ic('checkCircle')}<div class="grow"><b>Finalizată</b> ${q.completedAt ? U.fmtDateTime(q.completedAt) : ''}</div></div>`;
  else if (q.status === 'failed') primary = h`<div class="note bad">${ic('hourglass')}<div class="grow"><b>Misiunea a expirat.</b> XP-ul câștigat până acum rămâne. Poți reactiva misiunea cu un termen nou.</div></div><button class="btn block mt12" data-a="quest-reopen" data-id="${q.id}">${ic('refresh')}Reactivează</button>`;
  else if (q.archived) primary = h`<div class="note">${ic('archive')}<div class="grow">Misiune arhivată.</div></div><button class="btn block mt12" data-a="quest-unarchive" data-id="${q.id}">${ic('undo')}Restaurează</button>`;
  else if (q.status === 'paused') primary = h`<button class="btn block" data-a="quest-resume" data-id="${q.id}">${ic('play')}Reia misiunea</button>`;
  else if (q.status === 'available') primary = h`<button class="btn green block" data-a="quest-start" data-id="${q.id}">${ic('play')}Începe Misiunea</button><button class="btn quiet block mt8" data-a="quest-complete" data-id="${q.id}">${ic('check')}Am terminat deja: finalizează</button>`;
  else primary = h`<button class="btn green block" data-a="quest-complete" data-id="${q.id}">${ic('check')}Finalizează Misiunea</button>`;
  const body = h`
  <div class="card neon cat-${q.category}" style="--rgb:${rgbOf(cat.color)}">
    <div class="row top-a g12"><span class="sec-ic" style="--rgb:${rgbOf(cat.color)};width:46px;height:46px">${ic(kind.icon, 's24')}</span><div class="grow"><h3 style="font-size:18px;line-height:1.3">${q.title}</h3><div class="pill-row mt8">${catChip(q.category)}${stars(q.difficulty)}</div></div></div>
    ${q.desc ? h`<p class="mt12 ink2">${q.desc}</p>` : ''}
    ${q.why ? h`<p class="mt8 sm muted"><b>De ce contează:</b> ${q.why}</p>` : ''}
  </div>
  ${q.steps.length ? h`<div class="card mt12"><div class="row between mb8"><h3 class="row g8">${ic('checklist', 't-purple')}Pași necesari</h3><span class="chip plain">${sd}/${q.steps.length}</span></div><div class="steps">${q.steps.map((s, i) => h`<button class="step ${s.done ? 'done' : ''}" data-a="step-toggle" data-id="${q.id}" data-sid="${s.id}" ${active || q.status === 'paused' ? '' : 'disabled'}><span class="chk round ${s.done ? 'on' : ''}">${ic('check')}</span><span class="st-t">${i + 1}. ${s.text}${s.note ? h`<span class="xs muted" style="display:block;font-style:italic;margin-top:3px">„${U.trunc(s.note, 120)}”</span>` : ''}</span>${s.tag && !s.done ? h`<span class="chip c-gold tg">${ic('pen')}dovadă</span>` : ''}</button>`)}</div>${barH('qd.' + q.id, (sd / q.steps.length) * 100, 'thin mt8', ['168 85 247', '56 189 248'])}</div>` : ''}
  ${q.target ? h`<div class="card mt12"><div class="row between mb8"><h3 class="row g8">${ic('target', 't-green')}Progres</h3><span class="chip plain">${q.progress}/${q.target.total} ${q.target.unit}</span></div>${barH('qt.' + q.id, (q.progress / q.target.total) * 100, 'green', ['52 211 153', '16 185 129'])}${active ? h`<div class="stepper mt12"><button data-a="prog-step" data-id="${q.id}" data-d="-1" aria-label="Scade">−</button><output>${q.progress}</output><button data-a="prog-step" data-id="${q.id}" data-d="1" aria-label="Crește">+</button><button class="btn xs ghost c-green" data-a="prog-full" data-id="${q.id}" style="margin-left:auto;white-space:nowrap">Tot</button></div>` : ''}</div>` : ''}
  ${q.criteria ? h`<div class="note mt12">${ic('badgeCheck')}<div class="grow"><b>Condiția de finalizare</b><br>${q.criteria}${q.proofRequired ? h`<br><span class="xs muted">Cere o notă scrisă ca dovadă (minimum ${CFG.rewards.noteMin} caractere).</span>` : ''}</div></div>` : ''}
  <div class="card mt12"><dl class="kv">
    <dt>Recompensă</dt><dd class="t-gold">${xpTxt(q.xp)}</dd>
    <dt>Tip</dt><dd>${kind.name}</dd>
    <dt>Timp estimat</dt><dd>${q.minutes ? U.fmtDur(q.minutes) : '—'}</dd>
    <dt>Termen</dt><dd class="${q.deadline && q.deadline < td && !dn ? 't-red' : ''}">${q.repeat === 'daily' ? 'zilnic' : q.deadline ? U.fmtDay(q.deadline) + ' (' + relDeadline(q.deadline) + ')' : 'fără termen'}</dd>
    <dt>Atribute</dt><dd>${q.attrs.map((a) => AttrById[a].name).join(', ')}</dd>
    ${q.postponeCount ? h`<dt>Amânări</dt><dd>${q.postponeCount}</dd>` : ''}
    <dt>Sursă</dt><dd>${{ user: 'creată de tine', template: 'șablon', ai: 'sugerată de Mentor (AI)', local: 'sugerată de Mentor (local)' }[q.source] || '—'}</dd>
  </dl>${q.xp > range.max ? h`<p class="hint mt8">Recompensa depășește intervalul obișnuit pentru dificultatea „${range.label}” (${range.min}–${range.max} XP).</p>` : ''}</div>
  <div class="mt16">${primary}</div>
  ${active || q.status === 'paused' ? h`<div class="grid2 mt12">
      <button class="btn quiet sm" data-a="quest-focus" data-id="${q.id}">${ic('timer')}Focus</button>
      ${active ? h`<button class="btn quiet sm" data-a="quest-postpone" data-id="${q.id}">${ic('skip')}Amână până mâine</button>` : h`<button class="btn quiet sm" data-a="quest-resume" data-id="${q.id}">${ic('play')}Reia</button>`}
      ${active ? h`<button class="btn quiet sm" data-a="quest-pause" data-id="${q.id}">${ic('pause')}Pauză</button>` : ''}
      <button class="btn quiet sm" data-a="quest-edit" data-id="${q.id}">${ic('edit')}Editează</button></div>` : ''}
  <div class="grid2 mt8">${q.status !== 'completed' || q.repeat === 'daily' ? '' : ''}${q.archived ? '' : h`<button class="btn quiet sm" data-a="quest-archive" data-id="${q.id}">${ic('archive')}Arhivează</button>`}<button class="btn danger sm" data-a="quest-delete" data-id="${q.id}">${ic('trash')}Șterge</button></div>
  ${hist.length ? h`<h2 class="h2"><span class="l">${ic('clock')}Istoric</span></h2><div class="list">${hist.map((c) => h`<div class="li" style="${c.reversed ? 'opacity:.55' : ''}"><div class="lt"><b style="${c.reversed ? 'text-decoration:line-through' : ''}">${U.fmtDateTime(c.at)}</b><small>${c.note ? U.trunc(c.note, 100) : c.reversed ? 'anulată' : 'fără notă'}${c.flags.length ? ' · ' + c.flags.map((f) => ({ limit_half: 'limită zilnică (50%)', limit_zero: 'limită zilnică', duplicate: 'duplicat', high_reward: 'recompensă neobișnuită' }[f] || f)).join(', ') : ''}</small></div><span class="${c.xp ? 'xp-up' : 'muted'}">${c.xp ? '+' + c.xp : '0'} XP</span>${!c.reversed ? h`<button class="ibtn plain" data-a="comp-undo" data-id="${c.id}" aria-label="Anulează finalizarea">${ic('undo')}</button>` : ''}</div>`)}</div>` : ''}`;
  return { head, body, tab: 'quests' };
};

/* ---------- acțiuni pe o misiune ---------- */
const withQuest = (fn) => (el) => { const q = Eng.find(S, el.dataset.id); if (!q) return toast('Misiunea nu mai există.', { kind: 'bad' }); return fn(q, el); };
A['quest-start'] = withQuest((q) => { const r = Eng.startQuest(S, q.id); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast('Misiune începută. Succes!', { kind: 'good', icon: 'play' }); });
A['quest-pause'] = withQuest((q) => { const r = Eng.pauseQuest(S, q.id); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast('Misiune pusă în pauză.', { icon: 'pause' }); });
A['quest-resume'] = withQuest((q) => { const r = Eng.resumeQuest(S, q.id); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast('Misiune reluată.', { kind: 'good', icon: 'play' }); });
A['quest-postpone'] = withQuest((q) => { const r = Eng.postponeQuest(S, q.id); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast(r.tomorrow ? 'Amânată pentru mâine. Amânările apar în rapoarte, dar nu pierzi nimic.' : 'Scoasă din planul de azi.', { icon: 'skip' }); });
A['quest-archive'] = withQuest((q) => { const r = Eng.archiveQuest(S, q.id, true); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast('Misiune arhivată.', { icon: 'archive', action: { label: 'Anulează', fn: () => { Eng.archiveQuest(S, q.id, false); commit(); } } }); if (UI.route.name === 'quest') goBack(false); });
A['quest-unarchive'] = withQuest((q) => { const r = Eng.archiveQuest(S, q.id, false); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit(); toast('Misiune restaurată.', { kind: 'good' }); });
A['quest-edit'] = withQuest((q) => { UI.forms.q = formFromQuest(q); go('editor', { id: q.id }); });
A['quest-focus'] = withQuest((q) => { UI.focusPick = { questId: q.id }; go('focus'); });
A['quest-delete'] = withQuest((q) => confirmBox({ title: 'Ștergi misiunea?', text: '„' + q.title + '” va dispărea din liste. XP-ul deja câștigat din ea rămâne în jurnal (nu se șterge niciodată în tăcere).', ok: 'Șterge', danger: true }).then((ok) => {
  if (!ok) return; const r = Eng.removeQuest(S, q.id); if (!r.ok) return toast(r.error, { kind: 'bad' });
  commit(); toast('Misiune ștearsă.', { icon: 'trash' }); if (UI.route.name === 'quest') goBack(false);
}));
A['plan-toggle'] = withQuest((q) => { const td = U.dateKey(), inPlan = S.plans[td] && S.plans[td].ids.includes(q.id); if (inPlan) Eng.planRemove(S, q.id); else Eng.planAdd(S, q.id); commit(); toast(inPlan ? 'Scoasă din planul de azi.' : 'Adăugată în planul de azi.', { icon: 'star' }); });
A['comp-undo'] = (el) => confirmBox({ title: 'Anulezi finalizarea?', text: 'XP-ul va fi scăzut printr-o corecție, iar originalul rămâne în jurnal.', ok: 'Anulează finalizarea', cancel: 'Păstrează', danger: true }).then((ok) => { if (ok) undoCompletion(el.dataset.id); });
A['quest-reopen'] = withQuest((q) => {
  UI.forms.ro = { id: q.id, deadline: U.addDays(U.dateKey(), q.category === 'daily' ? 0 : 3), none: q.category === 'daily' };
  sheet('ro', 'Reactivează misiunea', () => h`${sheetHead('Reactivează misiunea', q.title)}
    <p class="muted sm">Progresul pașilor se păstrează. Alege un termen nou, realist.</p>
    <div class="field mt12"><label for="ro-d">Termen nou</label><input class="inp" id="ro-d" type="date" min="${U.dateKey()}" data-f="ro.deadline" value="${UI.forms.ro.deadline}"></div>
    <div class="btn-row mt16"><button class="btn quiet" data-a="ov-close">Anulează</button><button class="btn" data-a="ro-go">${ic('refresh')}Reactivează</button></div>`);
});
A['ro-go'] = () => { const f = UI.forms.ro; const r = Eng.reopenQuest(S, f.id, f.deadline || null); if (!r.ok) return toast(r.error, { kind: 'bad' }); Ov.close('ro'); commit(); toast('Misiune reactivată.', { kind: 'good', icon: 'refresh' }); };
/* pași */
A['step-toggle'] = (el) => {
  const q = Eng.find(S, el.dataset.id); if (!q) return; const s = q.steps.find((x) => x.id === el.dataset.sid); if (!s) return;
  if (!s.done && s.tag) {
    return noteSheet({ title: 'Dovadă pentru acest pas', sub: s.text, label: 'Descrie pe scurt ce ai realizat', min: CFG.rewards.proofChars, initial: s.note || '', placeholder: 'Ex.: ce ai construit, unde îl poți vedea, ce a funcționat.', info: 'Pașii de bornă dau realizări reale, așa că cer o scurtă dovadă scrisă.', cta: 'Bifează pasul', icon: 'check',
      submit: (note) => { const r = Eng.toggleStep(S, q.id, s.id, true, note); if (!r.ok) return r; commit(); toast('Pas bifat.', { kind: 'good', icon: 'check' }); return r; } });
  }
  const r = Eng.toggleStep(S, q.id, s.id); if (!r.ok) return toast(r.error, { kind: 'bad' }); commit();
};

/* ===================================================================================
   FORMULAR: CREARE / EDITARE MISIUNE
   =================================================================================== */
function blankQuestForm(cat) {
  const range = CFG.rewards.byDifficulty[2];
  return { id: null, title: '', desc: '', category: cat || 'daily', kind: 'other', difficulty: 2, xp: range.rec, xpTouched: false, rewardReviewed: false, deadline: '', minutes: '', attrs: [], attrsTouched: false, criteria: '', proofRequired: false, why: '', steps: [], target: { total: '', unit: '' }, repeat: 'none', similarOk: false, _errors: {} };
}
function formFromQuest(q) {
  return { id: q.id, title: q.title, desc: q.desc, category: q.category, kind: q.kind, difficulty: q.difficulty, xp: q.xp, xpTouched: true, rewardReviewed: q.rewardReviewed, deadline: q.deadline || '', minutes: q.minutes || '', attrs: q.attrs.slice(), attrsTouched: true, criteria: q.criteria, proofRequired: q.proofRequired, why: q.why || '', steps: q.steps.map((s) => ({ id: s.id, text: s.text, tag: s.tag })), target: q.target ? { total: q.target.total, unit: q.target.unit } : { total: '', unit: '' }, repeat: q.repeat, similarOk: true, _errors: {} };

const hexPath = (x, y, r) => {
  let d = '';
  for (let i = 0; i < 6; i++) { const a = (Math.PI / 180) * (60 * i - 90); d += (i ? 'L' : 'M') + (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1); }
  return d + 'Z';
};
/* împarte o etichetă în maximum 2 rânduri */
function wrapLabel(txt, n) {
  const words = String(txt).split(' '); const lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur);
  if (lines.length > 2) { const rest = lines.slice(1).join(' '); return [lines[0], U.trunc(rest, n)]; }
  return lines;
}
const branchOf = (id) => CFG.attrs.find((a) => a.id === id);
const skillsOf = (b) => SKILLS.filter((s) => s.branch === b);
const skillStatusLabel = { done: 'Deblocată', ready: 'Gata de deblocat', available: 'În lucru', locked: 'Blocată' };

/* poziționarea nodurilor pe niveluri (arbore orientat, de sus în jos) */
function layoutBranch(branch) {
  const nodes = skillsOf(branch), W = 360, TOP = 54, DY = 112;
  const tier = {}; nodes.forEach((n) => { tier[n.id] = Eng.tierOf(n.id); });
  const byTier = {}; nodes.forEach((n) => { (byTier[tier[n.id]] = byTier[tier[n.id]] || []).push(n); });
  const maxT = Math.max(1, ...Object.keys(byTier).map(Number));
  const pos = {};
  for (let t = 1; t <= maxT; t++) {
    const row = byTier[t] || [];
    const key = (n) => (n.req.length ? n.req.reduce((a, r) => a + (pos[r] ? pos[r].x : W / 2), 0) / n.req.length : W / 2);
    row.sort((a, b) => key(a) - key(b));
    row.forEach((n, i) => { pos[n.id] = { x: W * (i + 1) / (row.length + 1), y: TOP + (t - 1) * DY }; });
  }
  return { nodes, pos, W, H: TOP + (maxT - 1) * DY + 92, maxT };
}

function skillNodeSvg(n, p, st, R) {
  const col = st.status === 'done' ? 'gold' : st.status;
  const open = st.crits.find((c) => !c.met);
  const lines = wrapLabel(n.name, 14);
  const label = lines.map((l, i) => '<tspan x="' + p.x.toFixed(1) + '" dy="' + (i ? 12 : 0) + '">' + esc(l) + '</tspan>').join('');
  const badge = st.status === 'done'
    ? '<g transform="translate(' + (p.x + R * 0.62).toFixed(1) + ' ' + (p.y - R * 0.62).toFixed(1) + ')"><circle r="9" fill="rgb(var(--gold))"/>' + icIn('check', -6, -6, 12, '#3b2500') + '</g>'
    : st.status === 'locked' ? '<g transform="translate(' + (p.x + R * 0.62).toFixed(1) + ' ' + (p.y - R * 0.62).toFixed(1) + ')"><circle r="9" fill="var(--card-solid)" stroke="var(--faint)" stroke-width="1.5"/>' + icIn('lock', -6, -6, 12, 'var(--faint)') + '</g>' : '';
  const prog = st.status === 'available' && open ? '<text class="pg" x="' + p.x.toFixed(1) + '" y="' + (p.y + R + 14 + lines.length * 12 + 10).toFixed(1) + '" style="fill:rgb(var(--blue));font-size:10px">' + Math.min(open.cur, open.need) + '/' + open.need + '</text>' : '';
  return '<g class="sk-node" data-s="' + st.status + '" data-a="sk-open" data-id="' + esc(n.id) + '" role="button" tabindex="0" aria-label="' + esc(n.name + ', ' + skillStatusLabel[st.status]) + '">' +
    '<path class="hex" d="' + hexPath(p.x, p.y, R) + '"/><g class="ic">' + icIn(n.icon, p.x - 13, p.y - 13, 26) + '</g>' + badge +
    '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + R + 14).toFixed(1) + '">' + label + '</text>' + prog + '</g>';
}

function branchTreeSvg(branch) {
  const L = layoutBranch(branch), R = 31; const st = Stats.core(S);
  const states = {}; L.nodes.forEach((n) => { states[n.id] = Eng.skillState(S, n, st); });
  let edges = '', nodesSvg = '';
  for (const n of L.nodes) for (const r of n.req) {
    const a = L.pos[r], b = L.pos[n.id]; if (!a || !b) continue;
    const y1 = a.y + R, y2 = b.y - R, my = (y1 + y2) / 2;
    const cls = states[r].status === 'done' && states[n.id].status === 'done' ? 'on' : states[r].status === 'done' && (states[n.id].status === 'ready' || states[n.id].status === 'available') ? 'rdy' : '';
    edges += '<path class="sk-edge ' + cls + '" d="M' + a.x.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
  }
  for (const n of L.nodes) nodesSvg += skillNodeSvg(n, L.pos[n.id], states[n.id], R);
  return '<svg class="sk-svg" viewBox="0 0 ' + L.W + ' ' + L.H + '" role="group" aria-label="Arbore de abilități: ' + esc(branchOf(branch).name) + '">' + edges + nodesSvg + '</svg>';
}

/* vedere generală: hub radial cu cele 6 ramuri */
function hubSvg() {
  const W = 360, H = 392, cx = 180, cy = 190, RR = 128, r = 36;
  const pi = Prog.info(S.xp.total);
  let edges = '', nodes = '';
  CFG.attrs.forEach((a, i) => {

    const list = skillsOf(a.id), done = list.filter((s) => S.skills[s.id]).length;
    edges += '<line class="sk-edge ' + (done ? 'on' : '') + '" x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    const lab = wrapLabel(a.name, 12); const ly = y + r + 14;
    nodes += '<g class="sk-node sk-b" style="--rgb:' + rgbOf(a.color) + '" data-s="' + (done ? 'done' : 'available') + '" data-a="sk-tab" data-v="' + a.id + '" role="button" tabindex="0" aria-label="' + esc(a.name + ': ' + done + ' din ' + list.length + ' abilități') + '">' +
      '<path class="hex" d="' + hexPath(x, y, r) + '"/><g class="ic">' + icIn(a.icon, x - 15, y - 15, 30) + '</g>' +
      '<text x="' + x.toFixed(1) + '" y="' + ly.toFixed(1) + '">' + lab.map((l, k) => '<tspan x="' + x.toFixed(1) + '" dy="' + (k ? 12 : 0) + '">' + esc(l) + '</tspan>').join('') + '</text>' +
      '<text class="pg" x="' + x.toFixed(1) + '" y="' + (ly + (lab.length - 1) * 12 + 13).toFixed(1) + '" style="fill:rgb(' + rgbOf(a.color) + ');font-size:10.5px;font-weight:700">' + done + '/' + list.length + '</text></g>';
  });
  const center = '<g class="sk-center"><path class="hex" d="' + hexPath(cx, cy, 50) + '"/><g style="color:rgb(var(--gold))">' + icIn('crownG', cx - 17, cy - 30, 34) + '</g>' +
    '<text x="' + cx + '" y="' + (cy + 18) + '" style="font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle;font-family:var(--font)">' + esc(U.trunc(pi.rank.name, 12)) + '</text>' +

  return '<svg class="sk-svg" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Arbore de abilități: vedere generală">' + edges + center + nodes + '</svg>';
}

function skillProgress(stt) {

}

/* ---------- grafice SVG proprii (fără biblioteci) ---------- */
const niceMax = (v) => { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const kfmt = (v) => (v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (Math.round(v / 100) / 10).toString().replace('.', ',') + 'k' : String(Math.round(v)));

/* bare pe zile: days = [{key, xp}] */
function chartBars(days, label) {
  const W = 340, H = 172, L = 34, R = 6, T = 12, B = 26, n = days.length, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(0, ...days.map((d) => d.xp))), step = iw / n, bw = Math.max(3, Math.min(28, step * 0.62)), td = U.dateKey();
  let g = '', bars = '', lab = '';
  for (let i = 0; i <= 2; i++) { const y = T + ih - (ih * i) / 2; g += '<line class="grid-l" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + kfmt((max * i) / 2) + '</text>'; }
  const every = n <= 8 ? 1 : n <= 16 ? 2 : 5;
  days.forEach((d, i) => {
    const x = L + step * i + (step - bw) / 2, hh = d.xp > 0 ? Math.max(3, (ih * d.xp) / max) : 0, isT = d.key === td;
    if (hh > 0) bars += '<rect class="bar-r ' + (isT ? 'today' : '') + '" x="' + x.toFixed(1) + '" y="' + (T + ih - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="' + Math.min(5, bw / 2).toFixed(1) + '"><title>' + esc(U.fmtDayShort(d.key) + ': ' + U.fmtNum(d.xp) + ' XP') + '</title></rect>';
    else bars += '<rect x="' + x.toFixed(1) + '" y="' + (T + ih - 2) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" fill="var(--faint)" opacity=".5"><title>' + esc(U.fmtDayShort(d.key) + ': 0 XP') + '</title></rect>';
    if (i % every === 0 || i === n - 1) lab += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle"' + (isT ? ' style="fill:rgb(var(--gold));font-weight:700"' : '') + '>' + (n <= 8 ? U.dow1(d.key) : U.parseKey(d.key).getDate()) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label || 'XP pe zile') + '">' + g + bars + lab + '</svg>';
}
/* linie cumulativă: pts = [{key, v}] */
function chartLine(pts, label) {
  const W = 340, H = 150, L = 38, R = 8, T = 14, B = 24, iw = W - L - R, ih = H - T - B;
  const lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  const span = Math.max(1, hi - lo), mn = Math.max(0, lo - span * 0.1), mx = hi + span * 0.1, rng = Math.max(1, mx - mn);
  const X = (i) => L + (pts.length === 1 ? iw / 2 : (iw * i) / (pts.length - 1)), Y = (v) => T + ih - ((v - mn) / rng) * ih;
  let d = '', area = '';
  pts.forEach((p, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1); });
  area = d + 'L' + X(pts.length - 1).toFixed(1) + ' ' + (T + ih) + 'L' + X(0).toFixed(1) + ' ' + (T + ih) + 'Z';
  const grid = [0, 0.5, 1].map((f) => { const y = T + ih - ih * f; return '<line class="grid-l" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + kfmt(mn + rng * f) + '</text>'; }).join('');
  const last = pts[pts.length - 1];
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label || 'XP total') + '">' + grid +
    '<path d="' + area + '" fill="url(#gArea)"/><path d="' + d + '" fill="none" stroke="url(#gLine)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="4.5" fill="rgb(var(--gold))" stroke="var(--bg)" stroke-width="2"/>' +
    '<text x="' + L + '" y="' + (H - 7) + '">' + esc(U.fmtDayShort(pts[0].key)) + '</text><text x="' + (W - R) + '" y="' + (H - 7) + '" text-anchor="end">' + esc(U.fmtDayShort(last.key)) + '</text></svg>';
}
/* hartă de activitate (12 săptămâni) */
function heatmapH() {
  const td = U.dateKey(), start = U.addDays(U.weekStart(td), -77), days = Stats.xpByDay(S, start, 84), set = Stats.activeDaySet(S);
  const mx = Math.max(1, ...days.map((d) => d.xp));
  const cells = days.map((d) => {
    if (d.key > td) return '<i style="visibility:hidden"></i>';

    return '<i data-l="' + l + '" class="' + (d.key === td ? 'today' : '') + '" title="' + esc(U.fmtDayShort(d.key) + ': ' + U.fmtNum(d.xp) + ' XP') + '"></i>';
  }).join('');
  return '<div class="heat-h">' + ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((x) => '<span>' + x + '</span>').join('') + '</div><div class="heat" role="img" aria-label="Zile active în ultimele 12 săptămâni">' + cells + '</div>';
}

const RING_R = 90, RING_C = 2 * Math.PI * RING_R;
const OUTCOMES = [

];

function fsForm() {

  const F = UI.forms.fs;
  if (UI.focusPick && UI.focusPick.questId) { F.questId = UI.focusPick.questId; const q = Eng.find(S, F.questId); if (q) { F.kind = q.kind; } UI.focusPick = null; }
  if (F.questId && !Eng.find(S, F.questId)) F.questId = '';
  return F;
}
/* estimare XP (doar pentru afișare; motorul decide la salvare) */
function focusEstimate(minutes, outcome) {
  const F = CFG.focus, td = U.dateKey(); const rewarded = S.focus.history.filter((f) => f.dateKey === td && f.xp > 0).length;
  if (outcome === 'none') return { xp: 0, why: 'Fără rezultat concret nu se acordă XP.' };
  if (minutes < F.minMinutesForXp) return { xp: 0, why: 'Sub ' + F.minMinutesForXp + ' minute nu se acordă XP.' };
  if (rewarded >= F.rewardedPerDay) return { xp: 0, why: 'Ai atins limita de ' + F.rewardedPerDay + ' sesiuni recompensate azi.' };
  return { xp: Math.min(F.maxXpPerSession, Math.round(minutes * F.xpPerMinute)), why: '' };
}
function ringSvg(p, over) {
  const off = RING_C * (1 - U.clamp(p, 0, 1));
  return '<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="tr" cx="100" cy="100" r="' + RING_R + '"/><circle class="pg" id="ft-pg" cx="100" cy="100" r="' + RING_R + '" stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"/></svg>';

  const m = /###\s*(Recomand[^\n]*|Pentru mâine|Obiective[^\n]*|Recommend[^\n]*|For tomorrow|Goals[^\n]*|Рекоменд[^\n]*|На завтра|Цели[^\n]*)\n([\s\S]*?)(?=\n###|$)/i.exec(String(text || ''));

/* cât timp așteptăm AI-ul: secunde scurse, explicații și, după un timp, varianta „răspuns local acum” */
function thinkHtml() {
  const M = UI.mentor, sec = M.startedAt ? Math.max(0, Math.round((Date.now() - M.startedAt) / 1000)) : 0;
  const first = !M.partial;
  return h`<div class="think-row">${ic('sparkle', 's14')}<span>${first ? 'Mentorul (AI) se gândește…' : 'Mentorul (AI) scrie…'}</span><b>${sec} s</b></div>
    ${first && sec >= CFG.ai.hintAfterS ? h`<p>Dacă vezi o fereastră care cere permisiunea de a folosi Claude, apasă „Permite”. Uneori răspunsul durează până la un minut.</p>` : ''}
    ${first && sec >= CFG.ai.localAfterS ? h`<button class="btn xs quiet mt8" data-a="mentor-local-now">${ic('shield')}Nu mai aștept: răspuns local acum</button>` : ''}`;
}
function thinkTick() { const el = $('#think'); if (!el || !UI.mentor.busy) return; const stick = nearBottom(); el.innerHTML = thinkHtml().toString(); if (stick) scrollLatest(false); }
async function mentorAsk(req, userText) {
  const M = UI.mentor; if (M.busy) return;
  if (userText) Eng.addMessage(S, 'user', userText, 'user');
  M.busy = true; M.partial = ''; M.wantLocal = false; M.startedAt = Date.now(); M.ai = AI.canUseAI(S);
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null; M.abort = ctl;
  commit({ keepSheets: true }); scrollLatest();
  clearInterval(M.ticker); M.ticker = M.ai ? setInterval(thinkTick, 1000) : null;
  let r;
  try { r = await AI.ask(S, Object.assign({}, req, { signal: ctl ? ctl.signal : undefined, onText: (t) => { M.partial = t; streamUpdate(t); } })); }
  catch (e) { r = { ok: false, error: (e && e.message) || 'Eroare necunoscută' }; }
  if (r && r.cancelled && M.wantLocal) {
    try { r = await AI.ask(S, Object.assign({}, req, { mode: 'local' })); if (r && r.ok) r.localNow = true; } catch (e) { r = { ok: false, error: (e && e.message) || 'Eroare necunoscută' }; }
  }
  clearInterval(M.ticker); M.ticker = null;
  M.busy = false; M.abort = null; M.partial = ''; M.wantLocal = false; M.ai = false;
  try {
    if (r.localNow) Eng.addMessage(S, 'system', 'Am oprit cererea către AI și am răspuns local, pe baza datelor tale.', 'system');
    if (r.cancelled) {
      if (r.partial) Eng.addMessage(S, 'assistant', r.partial + '\n\n_(răspuns oprit)_', 'ai');
      else Eng.addMessage(S, 'system', 'Cererea a fost oprită.', 'system');
    } else if (!r.ok) Eng.addMessage(S, 'system', r.error || 'Nu am putut răspunde acum.', 'system', 'error');
    else {
      Eng.addMessage(S, 'assistant', r.text || '—', r.source === 'ai' ? 'ai' : 'local', r.intent === 'today' ? 'today' : null);
      if (r.fallback && !r.fallback.soft && r.fallback.message) Eng.addMessage(S, 'system', r.fallback.message + (r.fallback.partial ? ' Răspuns parțial primit înainte de eroare: „' + U.trunc(r.fallback.partial, 160) + '”' : ''), 'system', 'fallback');
      if (r.drafts && r.drafts.length) {
        const added = Eng.addSuggestionDrafts(S, r.drafts, r.source === 'ai' ? 'ai' : 'local');
        if (!added.length) Eng.addMessage(S, 'system', 'Sugestiile propuse sunt deja în lista ta de sugestii în așteptare.', 'system');
      }
      if (r.intent === 'analyze') {
        S.mentor.lastAnalysis = { text: r.text, at: U.now(), source: r.source === 'ai' ? 'ai' : 'local' };
        const rc = extractRec(r.text); if (rc) { S.mentor.recs.push({ id: U.uid('rc'), text: rc, at: U.now(), source: r.source === 'ai' ? 'ai' : 'local' }); S.mentor.recs = S.mentor.recs.slice(-12); }
      }
    }
  } catch (e) { handleErr(e); }
  UI.mentorScroll = true;
  commit({ keepSheets: true });
  if (UI.route.name === 'mentor') scrollLatest();
}

/* ---------- formularul de profil ---------- */
const PF_MAX_GOALS = 12, PF_MAX_PROJECTS = 8, PF_MAX_PRIO = 3;
const pfFromProfile = (P) => ({
  name: P.name || '', avatar: P.avatar, goals: (P.goals || []).slice(), customGoal: '', priorities: (P.priorities || []).slice(),
  dailyMinutes: P.dailyMinutes, experience: P.experience, difficulty: P.difficulty, feedback: P.feedback, projects: (P.projects || []).slice()
});
const pfToProfile = (f) => {
  const goals = f.goals.slice(); const cg = String(f.customGoal || '').replace(/\s+/g, ' ').trim();
  if (cg.length >= 3 && goals.length < PF_MAX_GOALS && !goals.some((g) => U.norm(g) === U.norm(cg))) goals.push(cg.slice(0, 140));
  return { name: String(f.name || '').trim(), avatar: f.avatar, goals, priorities: f.priorities, dailyMinutes: f.dailyMinutes, experience: f.experience, difficulty: f.difficulty, feedback: f.feedback, projects: f.projects };
};
const pfForm = () => UI.forms.pf || (UI.forms.pf = pfFromProfile(S.profile));
const pfRefresh = () => { if (Ov.has('prof')) Ov.refresh('prof'); else render(); };

function pfNameField(f, id) {

/* Enter într-un câmp cu data-enter rulează acțiunea indicată (util pe tastatura telefonului) */
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.key !== 'Enter' || e.isComposing || !el || !el.dataset || !el.dataset.enter || el.tagName === 'TEXTAREA') return;
  const fn = A[el.dataset.enter]; if (typeof fn !== 'function') return;
  e.preventDefault();
  try { const r = fn(el, e); if (r && typeof r.catch === 'function') r.catch(handleErr); } catch (err) { handleErr(err); }
});

A['prof-edit'] = () => {
  UI.forms.pf = pfFromProfile(S.profile);

/* ---------- ultima copie de siguranță (memorată doar în acest browser) ---------- */
const LAST_BK = 'lifeRpg.lastBackup.v1';
const BACKUP_STALE_DAYS = 14;
const lastBackupAt = () => { try { const v = Number(localStorage.getItem(LAST_BK)); return Number.isFinite(v) && v > 0 ? v : null; } catch (e) { return null; } };
const markBackup = () => { try { localStorage.setItem(LAST_BK, String(U.now())); } catch (e) { /* ignorăm */ } };
function backupInfo() {
  const t = lastBackupAt(), has = !!S && Val.summary(S).hasProgress;
  if (!t) return { cls: has ? 'warn' : '', txt: has ? 'Nu ai exportat încă nicio copie de siguranță din acest browser. Dacă ștergi datele site-ului, progresul se pierde.' : 'Nu ai exportat încă nicio copie de siguranță.', stale: has };
  const d = Math.floor((U.now() - t) / 86400000);
  return { cls: d >= BACKUP_STALE_DAYS && has ? 'warn' : '', txt: 'Ultima copie exportată: ' + U.fmtRel(t) + '.' + (d >= BACKUP_STALE_DAYS && has ? ' A trecut ceva timp: merită una nouă.' : ''), stale: d >= BACKUP_STALE_DAYS };
}
const storageLabel = () => {
  const s = Store.status();
  return s.mode === 'indexeddb' ? 'IndexedDB, cu oglindă în localStorage' : s.mode === 'localstorage' ? 'localStorage (IndexedDB nu este disponibil)' : 'doar în memorie: se pierde la închidere';

/* ---------- starea salvării în cont (text scurt pentru chip-uri) ---------- */
function cloudStatusInfo() {
  const cs = Cloud.status();
  if (!Host.caps.ready) return { cls: 'busy', txt: 'Se verifică…', off: false };
  if (!Host.hasCloud()) return { cls: 'off', txt: 'Indisponibilă în acest context', off: true };
  if (S && S.settings.cloud === false) return { cls: 'off', txt: 'Oprită', off: true };
  switch (cs.phase) {
    case 'saved': return { cls: '', txt: cs.lastSyncAt ? 'Salvat în cont ' + U.fmtRel(cs.lastSyncAt) : 'La zi cu contul', off: false };
    case 'saving': return { cls: 'busy', txt: 'Se salvează în cont…', off: false };
    case 'pending': return { cls: 'busy', txt: 'Modificări în așteptare', off: false };
    case 'conflict': return { cls: 'bad', txt: 'Conflict: alege ce copie păstrezi', off: false };
    case 'error': return { cls: 'bad', txt: cs.error || 'Eroare la salvarea în cont', off: false };
    case 'paused': return { cls: 'warn', txt: 'În pauză', off: false };
    default: return { cls: '', txt: 'Gata de salvare', off: false };
  }
}
function updateCloudUI() {

/* ===== 18-app.js — pornirea aplicației: încărcare, recuperare, rollover zilnic, protecții la modificări externe ===== */

function applyPrefs(src) {
  const s = src || (S && S.settings) || {};
  const r = document.documentElement;
  r.lang = I18N.lang;
  const nv = document.getElementById('nav'); if (nv) nv.setAttribute('aria-label', 'Navigare principală');

  r.dataset.motion = s.motion === 'reduced' ? 'reduced' : (s.motion === 'full' ? 'full' : 'auto');

/* ---------- ecran de urgență: datele nu pot fi citite / altă versiune / eroare la pornire ---------- */
function showFatal(res) {
  res = res || {};
  UI.ready = false; S = null;
  const top = $('#top'), view = $('#view'), nav = $('#nav');
  if (top) top.innerHTML = ''; if (nav) nav.hidden = true;
  const fb = $('#focusbar'); if (fb) fb.innerHTML = ''; const bn = $('#banners'); if (bn) bn.innerHTML = '';
  view.className = 'scr nonav';
  const st = res.status;
  const title = st === 'newer' ? 'Datele provin dintr-o versiune mai nouă' : st === 'crash' ? 'Aplicația nu a putut porni' : 'Datele salvate nu au putut fi citite';
  const text = st === 'newer'
    ? 'Progresul de pe acest dispozitiv a fost salvat de o versiune mai nouă a aplicației. Nu am modificat nimic și salvarea este oprită ca să nu strice datele. Reîncarcă pagina ca să obții versiunea cea mai recentă.'
    : st === 'crash'
      ? 'A apărut o eroare la pornire (' + (res.error || 'necunoscută') + '). Nu am șters și nu am suprascris nimic. Încearcă din nou; dacă se repetă, importă o copie de siguranță.'
      : 'Am găsit date salvate pe acest dispozitiv, dar nu le pot citi. Nu am șters și nu am suprascris nimic: salvarea este oprită ca să nu pierzi ce a mai rămas. O copie brută a datelor a fost păstrată separat în stocarea locală.';
  view.innerHTML = h`<div class="splash" style="min-height:auto;padding-top:28px">${botSvg('big')}<h1 style="font-size:22px;margin:14px 0 6px">${title}</h1><p class="muted">${text}</p></div>
    ${res.sizes && res.sizes.length ? h`<div class="note">${ic('info')}<div class="grow xs">Date găsite: ${res.sizes.join(' · ')}</div></div>` : ''}
    ${res.error && st !== 'crash' ? h`<div class="note warn mt8">${ic('warn')}<div class="grow xs">Motiv tehnic: ${res.error}</div></div>` : ''}
    <div class="col mt16">
      <button class="btn block" data-a="fatal-import">${ic('upload')}Importă o copie de siguranță</button>
      <button class="btn quiet block" data-a="fatal-retry">${ic('refresh')}Încearcă din nou</button>

    </div>`;
}

/* ---------- pornirea efectivă după încărcarea datelor ---------- */
function start(res) {
  S = res.state;
  UI.notes = (res.notes || []).slice(0, 4);
  const lt = S.meta.lastTick;
  let ro = { changed: false, expired: 0, reset: 0 };
  try { ro = Eng.rollover(S); } catch (e) { console.error(e); }
  applyPrefs();
  Cloud.bind(() => S);
  UI.ready = true; UI.stack = []; UI.lastKey = null; UI.flags.hold = false;
  UI.route = S.profile.onboarded ? { name: 'home', p: {} } : { name: 'onboarding', p: {} };
  if (S.profile.onboarded && (res.repaired || ro.changed || lt !== S.meta.lastTick)) { try { Store.save(S); } catch (e) { console.error(e); } }
  render({ nav: true });
  updateSaveUI();
  if (ro.expired) toast(U.pl(ro.expired, 'misiune a expirat', 'misiuni au expirat') + '. XP-ul câștigat rămâne; le poți reactiva cu un termen nou.', { kind: 'warn', icon: 'hourglass', ms: 6000 });
  cloudBoot();
}

/* ---------- verificarea contului la pornire ---------- */
let cloudStarted = false;
async function cloudBoot() {
  try { await Host.init(); } catch (e) { /* ignorăm */ }
  if (!S) return;
  try { Social.boot(S); } catch (e) { /* clasament opțional */ }
  try {
    if (!Host.hasCloud() || S.settings.cloud === false) { updateCloudUI(); return; }
    const r = await Cloud.check(S);
    if (r.adopted) { try { Store.save(S); } catch (e) { /* ignorăm */ } }
    if (r.kind === 'cloud_only' || r.kind === 'conflict') cloudDialog(r);
    else if (r.kind === 'error') { UI.notes.push(r.error || 'Salvarea în cont nu a putut fi verificată.'); }
    if (!cloudStarted) { cloudStarted = true; Cloud.watch((remote) => { cloudDialog({ kind: 'conflict', remote, external: true }); }); }
  } catch (e) { console.error(e); }
  renderBanners(); updateCloudUI();
}

/* ---------- rollover zilnic ---------- */
function tickDay() {
  if (!S || !UI.ready || UI.flags.hold || !S.profile.onboarded) return;
  if (S.meta.lastTick === U.dateKey()) return;
  let r = { expired: 0 };
  try { r = Eng.rollover(S); } catch (e) { console.error(e); }
  commit({ keepSheets: true });
  if (r.expired) toast(U.pl(r.expired, 'misiune a expirat', 'misiuni au expirat') + '. XP-ul câștigat rămâne.', { kind: 'warn', icon: 'hourglass' });
}

/* ---------- altă filă a salvat o stare mai nouă? ---------- */
let extBusy = false, extTimer = null;
function checkExternal() {
  if (!S || !UI.ready || extBusy) return;
  const o = Store.peekNewer(S); if (!o) return;
  extBusy = true; UI.flags.hold = true;
  confirmBox({
    title: 'Datele au fost modificate în altă filă', sticky: true, ok: 'Încarcă versiunea nouă', cancel: 'Păstrează această filă',
    html: h`<p>Aplicația este deschisă și într-o altă filă sau fereastră, iar acolo s-au salvat modificări mai noi (nivel ${Prog.levelFor((o.xp && o.xp.total) || 0)}, ${U.fmtNum((o.xp && o.xp.total) || 0)} XP).</p><p class="sm muted mt8">Dacă păstrezi această filă, modificările mai noi din cealaltă filă sunt suprascrise.</p>`
  }).then((adopt) => {
    try {
      const latest = Store.peekNewer(S) || o;   // cea mai nouă stare din acest moment: cealaltă filă poate fi salvat din nou cât timp dialogul era deschis
      if (adopt) {
        const r = Val.repair(Val.migrate(latest)); S = r.state; Cloud.bind(() => S); applyPrefs(); UI.flags.hold = false;
        UI.stack = []; UI.route = S.profile.onboarded ? { name: 'home', p: {} } : { name: 'onboarding', p: {} }; render({ nav: true });
        toast('Am încărcat versiunea cea mai nouă a progresului.', { kind: 'good' });
      } else {
        S.meta.saveCount = Math.max(S.meta.saveCount || 0, (latest.meta && latest.meta.saveCount) || 0);
        UI.flags.hold = false; commit(); toast('Am păstrat datele din această filă.', { kind: 'info' });
      }
    } catch (e) { handleErr(e); } finally { extBusy = false; UI.flags.hold = false; }
  });
}
window.addEventListener('storage', (e) => { try { if (e.key === Store._ls.state) { clearTimeout(extTimer); extTimer = setTimeout(checkExternal, 400); } } catch (x) { /* ignorăm */ } });

/* ---------- ciclul de viață al paginii ---------- */
function flushAll() {
  try { Store.flush(); } catch (e) { /* ignorăm */ }
  try { if (S && Host.hasCloud() && S.settings.cloud !== false) Cloud.flushNow(); } catch (e) { /* ignorăm */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flushAll(); return; }
  tickDay(); checkExternal(); updateSaveUI();
});
window.addEventListener('pagehide', flushAll);
setInterval(() => { tickDay(); updateSaveUI(); }, 30000);

Store.onChange((s) => {
  updateSaveUI();
  const k = [s.locked, s.lastError, s.mode].join('|');
  if (k !== UI.bannerKey) { UI.bannerKey = k; if (UI.ready) renderBanners(); }
});
if (typeof Cloud.onChange === 'function') Cloud.onChange(() => { if (!UI.ready) return; updateCloudUI(); const k = Cloud.status().phase; if (k !== UI.cloudPhase) { UI.cloudPhase = k; renderBanners(); } });
Social.onChange(() => { if (UI.ready && UI.route.name === 'progress' && UI.pgTab === 'lb' && !Ov.count()) { try { render({}); } catch (e) { /* ignorăm */ } } });
Host.onChange(() => { if (UI.ready && ['mentor', 'profile', 'settings', 'backup'].includes(UI.route.name)) { try { render({}); } catch (e) { /* ignorăm */ } } });

/* ---------- erori neprevăzute: vizibile, dar fără spam ---------- */
let lastErrAt = 0;
function softError(msg) {
  console.error(msg);
  if (!UI.ready || Date.now() - lastErrAt < 5000) return;
  if (/ResizeObserver|Script error/i.test(String(msg))) return;
  lastErrAt = Date.now();
  toast('Eroare neașteptată: ' + String(msg).slice(0, 120) + '. Datele tale rămân salvate.', { kind: 'bad', title: 'Eroare' });
}
window.addEventListener('error', (e) => { softError((e && e.message) || 'eroare'); });
window.addEventListener('unhandledrejection', (e) => { softError((e && e.reason && e.reason.message) || e.reason || 'promisiune respinsă'); });

/* ---------- tastatură pe mobil: ascundem bara de jos cât scrii în conversație ---------- */
/* Doar un câmp de text din conversație activează modul „tastatură”. Dacă și butonul „Trimite” l-ar activa la focus, bara de jos ar dispărea
   în timpul atingerii, butonul s-ar muta de sub deget, iar atingerea s-ar pierde (găsit de parcursul automat, TEST 13). */
const isComposeField = (el) => !!(el && el.matches && el.matches('.compose textarea, .compose input'));
document.addEventListener('focusin', (e) => { if (isComposeField(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout', (e) => { if (isComposeField(e.target)) setTimeout(() => { if (!isComposeField(document.activeElement)) document.body.classList.remove('kb'); }, 60); });

/* ---------- pornire ---------- */
let booting = false;
async function boot() {
  if (booting) return; booting = true;
  try {
    applyPrefs(Store.readPrefs());
    if (!boot.inited) { boot.inited = true; Hist.init(() => goBack(true)); }
    try { Host.init(); } catch (e) { /* ignorăm */ }
    const view = $('#view'); if (view) { view.className = 'scr nonav'; view.innerHTML = '<div class="loading"><div><div class="spin"></div><p class="muted">Se încarcă LIFE RPG…</p></div></div>'; }
    let res;
    try { res = await Store.load(); } catch (e) { console.error(e); res = { status: 'crash', state: null, error: (e && e.message) || String(e) }; }
    if (!res.state) { showFatal(res); return; }
    start(res);
  } catch (e) {
    console.error(e);
    showFatal({ status: 'crash', error: (e && e.message) || String(e) });
  } finally { booting = false; }
}

;
/* ---- 99-main.js ---- */
/* ===== 99-main.js — pornește aplicația după ce toate modulele sunt definite ===== */
boot();
